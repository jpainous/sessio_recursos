<title>Sistema Musculoesquelètic I - 27 Exercicis Combinats</title>
<style>
  :root{
    --primary:#0f4c5c;
    --secondary:#1b7f8c;
    --accent:#e36414;
    --bg:#f4f7f8;
    --card:#ffffff;
    --text:#1f2933;
    --muted:#5c6b73;
    --ok:#2a9d8f;
    --err:#c1121f;
    --review:#8a5a00;
    --essay:#6a4c93;
  }
  *{box-sizing:border-box;}
  body{
    font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    margin:0;
    padding:20px;
    line-height:1.55;
  }
  header{
    background:linear-gradient(135deg,var(--primary),var(--secondary));
    color:#fff;
    padding:28px 22px;
    border-radius:14px;
    margin-bottom:18px;
    box-shadow:0 6px 18px rgba(15,76,92,.25);
  }
  header h1{margin:0 0 8px;font-size:1.7rem;}
  header p{margin:0;opacity:.92;font-size:.98rem;}
  .howto{
    background:#fff;
    border-radius:12px;
    padding:18px 22px;
    margin-bottom:18px;
    box-shadow:0 3px 10px rgba(0,0,0,.07);
    border-left:5px solid var(--accent);
  }
  .howto summary{
    cursor:pointer;
    font-weight:700;
    color:var(--primary);
    font-size:1.05rem;
    list-style:none;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .howto summary::-webkit-details-marker{display:none;}
  .howto summary::before{
    content:"▶";
    font-size:.8rem;
    transition:.2s;
    color:var(--accent);
  }
  .howto[open] summary::before{transform:rotate(90deg);}
  .howto .howto-body{
    margin-top:14px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:14px;
  }
  .howto .step{
    background:#f4f9fa;
    border-radius:10px;
    padding:12px 14px;
    border:1px solid #e0ecee;
  }
  .howto .step h4{
    margin:0 0 6px;
    font-size:.9rem;
    color:var(--secondary);
    text-transform:uppercase;
    letter-spacing:.5px;
  }
  .howto .step p{
    margin:0;
    font-size:.88rem;
    color:var(--muted);
  }
  .howto .legend{
    margin-top:14px;
    font-size:.85rem;
    color:var(--muted);
    background:#fbfdfd;
    padding:10px 14px;
    border-radius:8px;
    border:1px dashed #cbd5d9;
  }
  .howto .legend b{color:var(--primary);}
  .howto .legend code{
    background:#eef4f5;
    padding:1px 6px;
    border-radius:4px;
    font-size:.82rem;
  }
  .lang-switch{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:18px;
  }
  .lang-switch button{
    background:#fff;
    border:2px solid var(--secondary);
    color:var(--secondary);
    padding:8px 18px;
    border-radius:30px;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
    font-size:.9rem;
  }
  .lang-switch button.active,
  .lang-switch button:hover{
    background:var(--secondary);
    color:#fff;
  }
  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:22px;
    background:#fff;
    padding:14px 16px;
    border-radius:12px;
    box-shadow:0 3px 10px rgba(0,0,0,.07);
    align-items:center;
  }
  .toolbar button{
    background:var(--primary);
    color:#fff;
    border:none;
    padding:9px 16px;
    border-radius:8px;
    font-size:.88rem;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
  }
  .toolbar button:hover{background:var(--secondary);}
  .toolbar button.alt{background:var(--accent);}
  .toolbar button.alt:hover{background:#c0520e;}
  .toolbar button.ghost{background:#eef4f5;color:var(--primary);border:2px solid var(--secondary);}
  .toolbar button.ghost:hover{background:var(--secondary);color:#fff;}
  .toolbar button.review{background:var(--review);}
  .toolbar button.review:hover{background:#6b4600;}
  .status{
    margin-left:auto;
    font-size:.85rem;
    color:var(--muted);
    font-weight:600;
  }
  .exercise{
    background:var(--card);
    border-radius:12px;
    padding:20px 22px;
    margin-bottom:18px;
    box-shadow:0 3px 10px rgba(0,0,0,.07);
    border-left:5px solid var(--secondary);
    transition:.3s;
  }
  .exercise.failed{border-left-color:var(--err);}
  .exercise.corrected{border-left-color:var(--ok);}
  .exercise.essay{border-left-color:var(--essay);}
  .exercise.essay.failed{border-left-color:var(--err);}
  .exercise.essay.corrected{border-left-color:var(--ok);}
  .exercise h3{
    margin:0 0 12px;
    font-size:1.05rem;
    color:var(--primary);
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
  }
  .badge{
    font-size:.72rem;
    background:var(--accent);
    color:#fff;
    padding:3px 10px;
    border-radius:20px;
    font-weight:700;
    letter-spacing:.4px;
    text-transform:uppercase;
  }
  .badge.essay{background:var(--essay);}
  .q{font-weight:600;margin-bottom:10px;}
  .scenario{
    background:#f4f0fa;
    border-left:4px solid var(--essay);
    padding:10px 14px;
    border-radius:8px;
    margin-bottom:12px;
    font-size:.93rem;
    color:#3d2c5c;
  }
  .options label{
    display:block;
    background:#eef4f5;
    padding:9px 13px;
    border-radius:8px;
    margin-bottom:7px;
    cursor:pointer;
    transition:.15s;
    border:1px solid transparent;
  }
  .options label:hover{background:#d9e8ea;}
  .options input{margin-right:8px;}
  input[type="text"], select{
    width:100%;
    padding:10px 12px;
    border:2px solid #cbd5d9;
    border-radius:8px;
    font-size:.95rem;
    font-family:inherit;
    background:#fbfdfd;
  }
  input[type="text"]:focus, select:focus{
    outline:none;
    border-color:var(--secondary);
    background:#fff;
  }
  textarea{
    width:100%;
    min-height:110px;
    padding:10px 12px;
    border:2px solid #cbd5d9;
    border-radius:8px;
    font-size:.95rem;
    font-family:inherit;
    background:#fbfdfd;
    resize:vertical;
  }
  textarea:focus{
    outline:none;
    border-color:var(--essay);
    background:#fff;
  }
  .match-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:8px;
    align-items:center;
  }
  .match-row span{
    background:#eef4f5;
    padding:8px 12px;
    border-radius:8px;
    font-size:.9rem;
  }
  .match-row select{padding:8px;}
  .order-list{
    list-style:none;
    padding:0;
    margin:0 0 10px;
  }
  .order-list li{
    background:#eef4f5;
    padding:9px 13px;
    border-radius:8px;
    margin-bottom:6px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .order-list input{width:60px;text-align:center;}
  .btn-check{
    background:var(--primary);
    color:#fff;
    border:none;
    padding:11px 26px;
    border-radius:8px;
    font-size:1rem;
    font-weight:700;
    cursor:pointer;
    margin-top:8px;
    transition:.2s;
  }
  .btn-check:hover{background:var(--secondary);}
  .btn-check.essay-btn{background:var(--essay);}
  .btn-check.essay-btn:hover{background:#543b78;}
  .btn-model{
    background:#fff;
    color:var(--essay);
    border:2px solid var(--essay);
    padding:9px 18px;
    border-radius:8px;
    font-size:.88rem;
    font-weight:600;
    cursor:pointer;
    margin-top:8px;
    margin-left:8px;
    transition:.2s;
  }
  .btn-model:hover{background:var(--essay);color:#fff;}
  .feedback{
    margin-top:10px;
    font-weight:600;
    font-size:.9rem;
    display:none;
    padding:9px 13px;
    border-radius:8px;
  }
  .feedback.ok{background:#d8f3ef;color:#1b6b5e;display:block;}
  .feedback.err{background:#fde2e4;color:#a4131d;display:block;}
  .feedback.model{
    background:#f4f0fa;
    color:#3d2c5c;
    display:block;
    font-weight:500;
    border-left:4px solid var(--essay);
  }
  .feedback.model b{color:var(--essay);}
  .hidden{display:none;}
  .banner{
    background:#fff3cd;
    border:1px solid #ffe08a;
    color:#7a5b00;
    padding:12px 16px;
    border-radius:10px;
    margin-bottom:18px;
    font-size:.9rem;
    display:none;
  }
  .banner.show{display:block;}
  .banner button{
    margin-left:10px;
    background:var(--primary);
    color:#fff;
    border:none;
    padding:6px 14px;
    border-radius:6px;
    cursor:pointer;
    font-size:.85rem;
    font-weight:600;
  }
  .banner button.ghost{background:#fff;color:var(--primary);border:1px solid var(--primary);}
  footer{
    text-align:center;
    color:var(--muted);
    font-size:.85rem;
    margin-top:30px;
    padding:18px;
  }
  .review-mode .exercise:not(.failed){display:none;}
  .review-mode .exercise.failed{display:block;}
  @media(max-width:600px){
    .match-row{grid-template-columns:1fr;}
    header h1{font-size:1.35rem;}
    .status{margin-left:0;width:100%;}
  }
</style>
</head>

function setLang(lang){
  currentLang = lang;
  document.querySelectorAll(".lang-switch button").forEach(b=>b.classList.remove("active"));

/* ---------- BARREJA ALEATÒRIA ---------- */
function shuffleArray(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function barrejarOpcions(ex){
  if(!ex.shuffle) return { opcions: ex[currentLang].o, correcteIndex: ex[currentLang].a };
  const opcions = ex[currentLang].o;
  const parells = opcions.map((t, i) => ({ t, orig: i }));
  const barrejats = shuffleArray(parells);
  const noves = barrejats.map(x => x.t);
  const nouIndex = barrejats.findIndex(x => x.orig === ex[currentLang].a);
  return { opcions: noves, correcteIndex: nouIndex };
}

function renderHowto(){
  const t = T[currentLang];
  const titol = document.getElementById("howto-titol");
  const body = document.getElementById("howto-body");
  const legend = document.getElementById("howto-legend");
  if(!titol || !body || !legend) return;
  titol.textContent = t["howto-titol"];
  let html = "";
  for(let i = 1; i <= 7; i++){
    html += `
      <div class="step">
        <h4>${t["howto-pas" + i + "-titol"]}</h4>
        <p>${t["howto-pas" + i + "-text"]}</p>
      </div>`;
  }
  body.innerHTML = html;
  legend.innerHTML = t["howto-legend"];
}

function render(){
  const quiz = document.getElementById("quiz");
  quiz.innerHTML = "";
  EX.forEach((ex, i)=>{
    const d = ex[currentLang];
    const div = document.createElement("div");
    div.className = "exercise" + (ex.type === "essay" ? " essay" : "");
    div.id = "ex" + i;

    let html = `<h3>${T[currentLang].ex} ${i+1} <span class="badge ${ex.type === "essay" ? "essay" : ""}">${T[currentLang].types[ex.type]}</span></h3>`;

    if(ex.type === "essay"){
      html += `<div class="scenario">📋 ${d.scenario}</div>`;
      html += `<p class="q">${d.q}</p>`;
      html += `<textarea id="in${i}" placeholder="${currentLang==='ca'?'Escriu la teva resposta raonada...':currentLang==='es'?'Escribe tu respuesta razonada...':'Write your reasoned answer...'}"></textarea>`;
      html += `<button class="btn-check essay-btn" onclick="check(${i})">${T[currentLang].check}</button>`;
      html += `<button class="btn-model" onclick="toggleModel(${i})" id="modelBtn${i}">${T[currentLang].showModel}</button>`;
      html += `<div class="feedback" id="fb${i}"></div>`;
      html += `<div class="feedback" id="md${i}" style="display:none;"></div>`;
    } else {
      html += `<p class="q">${d.q}</p>`;

      if(ex.type === "mc"){
        const { opcions, correcteIndex } = barrejarOpcions(ex);
        ex._correcteIndexActual = correcteIndex;
        html += `<div class="options">`;
        opcions.forEach((opt, j)=>{
          html += `<label><input type="radio" name="q${i}" value="${j}"> ${opt}</label>`;
        });
        html += `</div>`;
      }
      else if(ex.type === "fill" || ex.type === "short"){
        html += `<input type="text" id="in${i}" placeholder="${T[currentLang].select.replace('— ','').replace(' —','')}...">`;
      }
      else if(ex.type === "match"){
        const parells = d.pairs;
        let ordreOpcions = parells.map((_, k) => k);
        if(ex.shuffle) ordreOpcions = shuffleArray(ordreOpcions);
        ex._ordreOpcions = ordreOpcions;
        parells.forEach((p, j)=>{
          html += `<div class="match-row">
            <span>${p[0]}</span>
            <select id="m${i}_${j}">
              <option value="">${T[currentLang].select}</option>
              ${ordreOpcions.map((origIdx)=>`<option value="${origIdx}">${parells[origIdx][1]}</option>`).join("")}
            </select>
          </div>`;
        });
      }
      else if(ex.type === "order"){
        let items = d.items.slice();
        if(ex.shuffle){
          const idxs = items.map((_,k)=>k);
          const barrejats = shuffleArray(idxs);
          items = barrejats.map(k => d.items[k]);
          ex._ordreItems = barrejats;
        } else {
          ex._ordreItems = items.map((_,k)=>k);
        }
        html += `<ul class="order-list">`;
        items.forEach((it, j)=>{
          html += `<li><input type="number" min="1" max="${items.length}" id="o${i}_${j}"> ${it}</li>`;
        });
        html += `</ul>`;
      }

      html += `<button class="btn-check" onclick="check(${i})">${T[currentLang].check}</button>`;
      html += `<div class="feedback" id="fb${i}"></div>`;
    }

    div.innerHTML = html;
    quiz.appendChild(div);
  });
  updateStatus();
}

/* ============================================================
   CORRECCIÓ
   ============================================================ */
function normalize(s){
  return s.toString().toLowerCase().trim()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[.,;:!?·\-_.]/g,"")
    .replace(/\s+/g,"");
}

function check(i, silent){
  const ex = EX[i];
  const d = ex[currentLang];
  const fb = document.getElementById("fb" + i);
  const card = document.getElementById("ex" + i);
  let ok = false;
  let correctText = "";

  if(ex.type === "mc"){
    const sel = document.querySelector(`input[name="q${i}"]:checked`);
    const correcteIndex = ex._correcteIndexActual !== undefined ? ex._correcteIndexActual : d.a;
    if(sel && parseInt(sel.value) === correcteIndex){ ok = true; }
    correctText = d.o[correcteIndex];
  }
  else if(ex.type === "fill" || ex.type === "short"){
    const val = document.getElementById("in" + i).value;
    const variants = d.variants && d.variants.length ? d.variants : [d.a];
    if(variants.some(v => normalize(v) === normalize(val))){ ok = true; }
    correctText = d.a;
    if(ok && normalize(val) !== normalize(d.a) && d.variants && d.variants.length){
      fb.className = "feedback ok";
      fb.innerHTML = T[currentLang].variantsOk(d.a);
      results[i] = true;
      card.classList.remove("corrected","failed");
      card.classList.add("corrected");
      if(!silent){
        updateStatus();
        if(reviewMode) applyReviewFilter();
      }
      return;
    }
  }
  else if(ex.type === "match"){
    ok = true;
    d.pairs.forEach((p, j)=>{
      const sel = document.getElementById("m" + i + "_" + j).value;
      if(parseInt(sel) !== j) ok = false;
    });
    correctText = d.pairs.map((p,j)=>`${p[0]} → ${p[1]}`).join("; ");
  }
  else if(ex.type === "order"){
    ok = true;
    d.a.forEach((val, j)=>{
      const inp = document.getElementById("o" + i + "_" + j).value;
      if(parseInt(inp) !== val) ok = false;
    });
    correctText = d.items.map((it,j)=>`${d.a[j]}. ${it}`).join(" | ");
  }
  else if(ex.type === "essay"){
    const val = document.getElementById("in" + i).value;
    if(!val || val.trim().length < 15){
      fb.className = "feedback err";
      fb.textContent = T[currentLang].essayEmpty;
      return;
    }
    const norm = normalize(val);
    const found = d.keywords.filter(k => norm.includes(normalize(k)));
    const total = d.keywords.length;
    if(found.length >= Math.ceil(total * 0.5)){
      ok = true;
      fb.className = "feedback ok";
      fb.textContent = T[currentLang].essayOk + ` (${found.length}/${total})`;
    } else {
      ok = false;
      fb.className = "feedback err";
      fb.textContent = T[currentLang].essayPartial + ` (${found.length}/${total})`;
    }
  }

  if(ex.type !== "essay" && !(ex.type === "fill" && ok && normalize(document.getElementById("in"+i).value) !== normalize(d.a))){
    fb.className = "feedback " + (ok ? "ok" : "err");
    fb.textContent = ok ? T[currentLang].correct : T[currentLang].incorrect + correctText;
  }

  results[i] = ok;
  card.classList.remove("corrected","failed");
  card.classList.add(ok ? "corrected" : "failed");

  if(!silent){
    updateStatus();
    if(reviewMode) applyReviewFilter();
  }
}

function toggleModel(i){
  const md = document.getElementById("md" + i);
  const btn = document.getElementById("modelBtn" + i);
  const d = EX[i][currentLang];
  if(md.style.display === "none"){
    md.className = "feedback model";
    md.innerHTML = `<b>${T[currentLang].model}</b><br>${d.model}`;
    md.style.display = "block";
    btn.textContent = T[currentLang].hideModel;
  } else {
    md.style.display = "none";
    btn.textContent = T[currentLang].showModel;
  }
}

/* ============================================================
   REPÀS D'ERRORS
   ============================================================ */
function toggleReview(){
  if(!reviewMode){
    const failed = Object.keys(results).filter(k=>results[k] === false);
    if(failed.length === 0){
      showBanner(T[currentLang].reviewEmpty);
      return;
    }
    reviewMode = true;
    document.body.classList.add("review-mode");
    document.getElementById("reviewBtn").textContent = "🔁 " + (currentLang==="ca"?"Sortir del repàs":currentLang==="es"?"Salir del repaso":"Exit review");
    showBanner(T[currentLang].reviewOn);
  } else {
    reviewMode = false;
    document.body.classList.remove("review-mode");
    document.getElementById("reviewBtn").textContent = "🔁 " + (currentLang==="ca"?"Repàs d'errors":currentLang==="es"?"Repaso de errores":"Review errors");
    showBanner(T[currentLang].reviewOff);
  }
  applyReviewFilter();
  updateStatus();
}

function applyReviewFilter(){
  document.querySelectorAll(".exercise").forEach(card=>{
    card.classList.remove("failed","corrected");
    const idx = parseInt(card.id.replace("ex",""));
    if(results[idx] === true) card.classList.add("corrected");
    if(results[idx] === false) card.classList.add("failed");
  });
}

/* ============================================================
   SESSIÓ
   ============================================================ */
function collectState(){
  const state = {
    lang: currentLang,
    results: results,
    reviewMode: reviewMode,
    answers: {},
    timestamp: Date.now()
  };
  EX.forEach((ex, i)=>{
    const d = ex[currentLang];
    if(ex.type === "mc"){
      const sel = document.querySelector(`input[name="q${i}"]:checked`);
      state.answers[i] = sel ? parseInt(sel.value) : null;
    }
    else if(ex.type === "fill" || ex.type === "short" || ex.type === "essay"){
      state.answers[i] = document.getElementById("in" + i).value;
    }
    else if(ex.type === "match"){
      state.answers[i] = d.pairs.map((_, j)=>document.getElementById("m"+i+"_"+j).value);
    }
    else if(ex.type === "order"){
      state.answers[i] = d.items.map((_, j)=>document.getElementById("o"+i+"_"+j).value);
    }
  });
  return state;
}

function saveSession(){
  const state = collectState();
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    showBanner(T[currentLang].saved);
  }catch(e){
    showBanner("⚠️ No s'ha pogut guardar: " + e.message);
  }
}

function loadSession(silent){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(!raw){
    if(!silent) showBanner(T[currentLang].noSession);
    return false;
  }
  try{
    const state = JSON.parse(raw);
    applyState(state);
    if(!silent) showBanner(T[currentLang].loaded);
    return true;
  }catch(e){
    if(!silent) showBanner("⚠️ Error en recuperar: " + e.message);
    return false;
  }
}

function applyState(state){
  currentLang = state.lang || "ca";
  document.querySelectorAll(".lang-switch button").forEach(b=>b.classList.remove("active"));
  const btn = document.querySelector(`.lang-switch button[onclick="setLang('${currentLang}')"]`);
  if(btn) btn.classList.add("active");

  results = state.results || {};
  reviewMode = false;
  document.body.classList.remove("review-mode");
  const revBtn = document.getElementById("reviewBtn");
  revBtn.textContent = "🔁 " + (currentLang==="ca"?"Repàs d'errors":currentLang==="es"?"Repaso de errores":"Review errors");

  render();
  renderHowto();

  EX.forEach((ex, i)=>{
    const val = state.answers ? state.answers[i] : null;
    if(val === undefined || val === null) return;
    if(ex.type === "mc"){
      const radio = document.querySelector(`input[name="q${i}"][value="${val}"]`);
      if(radio) radio.checked = true;
    }
    else if(ex.type === "fill" || ex.type === "short" || ex.type === "essay"){
      const inp = document.getElementById("in" + i);
      if(inp) inp.value = val;
    }
    else if(ex.type === "match"){
      val.forEach((v, j)=>{
        const sel = document.getElementById("m"+i+"_"+j);
        if(sel) sel.value = v;
      });
    }
    else if(ex.type === "order"){
      val.forEach((v, j)=>{
        const inp = document.getElementById("o"+i+"_"+j);
        if(inp) inp.value = v;
      });
    }
  });

  Object.keys(results).forEach(k=>{
    const i = parseInt(k);
    if(!isNaN(i)) check(i, true);
  });
  applyReviewFilter();
  updateStatus();
}

function resetSession(){
  localStorage.removeItem(STORAGE_KEY);
  results = {};
  reviewMode = false;
  document.body.classList.remove("review-mode");
  const revBtn = document.getElementById("reviewBtn");
  revBtn.textContent = "🔁 " + (currentLang==="ca"?"Repàs d'errors":currentLang==="es"?"Repaso de errores":"Review errors");
  render();
  showBanner(T[currentLang].reset);
  updateStatus();
}

/* ============================================================
   UTILITATS
   ============================================================ */
function showBanner(msg, withPrompt){
  const b = document.getElementById("banner");
  b.innerHTML = msg;
  if(withPrompt){
    const yes = document.createElement("button");
    yes.textContent = T[currentLang].yes;
    yes.onclick = ()=>{ loadSession(); b.classList.remove("show"); };
    const no = document.createElement("button");
    no.className = "ghost";
    no.textContent = T[currentLang].no;
    no.onclick = ()=>{ resetSession(); b.classList.remove("show"); };
    b.appendChild(yes);
    b.appendChild(no);
  }
  b.classList.add("show");
  if(!withPrompt){
    clearTimeout(b._t);
    b._t = setTimeout(()=>b.classList.remove("show"), 3500);
  }
}

function updateStatus(){
  const total = EX.length;
  const done = Object.keys(results).length;
  const ok = Object.values(results).filter(v=>v===true).length;
  const ko = Object.values(results).filter(v=>v===false).length;
  const el = document.getElementById("status");
  const labels = {
    ca: `Respostes: ${done}/${total} · ✅ ${ok} · ❌ ${ko}`,
    es: `Respuestas: ${done}/${total} · ✅ ${ok} · ❌ ${ko}`,
    en: `Answers: ${done}/${total} · ✅ ${ok} · ❌ ${ko}`
  };
  el.textContent = labels[currentLang];
}

/* ============================================================
   INICIALITZACIÓ
   ============================================================ */
function init(){
  const raw = localStorage.getItem(STORAGE_KEY);
  render();
  renderHowto();
  if(raw){
    setTimeout(()=>{
      showBanner(T[currentLang].restorePrompt, true);
    }, 400);
  }
}

init();
</script>

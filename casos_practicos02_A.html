.lang-selector{position:absolute;top:15px;right:20px;display:flex;gap:5px}
.lang-selector button{background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.4);color:#fff;padding:5px 12px;border-radius:20px;cursor:pointer;font-size:.85em;font-weight:600;transition:.3s}
.lang-selector button:hover{background:rgba(255,255,255,.35)}
.lang-selector button.active{background:#fff;color:#1a1a2e;border-color:#fff}
.wrap{max-width:960px;margin:0 auto;padding:20px}

/* PERSONALIZACIÓN */
.personal{background:#fff;border-radius:14px;padding:28px 32px;margin-bottom:24px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
.personal h2{color:#1a1a2e;margin-bottom:16px;font-size:1.3em}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid label{font-weight:600;font-size:.9em;color:#555;display:block;margin-bottom:4px}
.form-grid input{width:100%;padding:10px 14px;border:2px solid #ddd;border-radius:8px;font-size:1em;transition:.3s}
.form-grid input:focus{border-color:#667eea;outline:none}
.time-row{display:flex;gap:14px;margin-top:14px}
.time-row div{flex:1}
.btn-start{margin-top:16px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;padding:12px 30px;border-radius:8px;font-size:1.05em;cursor:pointer;transition:.3s}
.btn-start:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(102,126,234,.4)}

/* BLOQUES */
.block{background:#fff;border-radius:14px;margin-bottom:24px;box-shadow:0 4px 20px rgba(0,0,0,.08);overflow:hidden;display:none}
.block.active{display:block}
.block-header{padding:22px 28px;color:#fff;font-size:1.2em;font-weight:700}
.block-header small{display:block;font-weight:400;font-size:.75em;opacity:.9;margin-top:4px}
.bh1{background:linear-gradient(135deg,#667eea,#764ba2)}
.bh2{background:linear-gradient(135deg,#11998e,#38ef7d)}
.bh3{background:linear-gradient(135deg,#ee5a6f,#ff6b6b)}
.bh4{background:linear-gradient(135deg,#f7971e,#ffd200)}
.bh5{background:linear-gradient(135deg,#6a11cb,#2575fc)}
.bh6{background:linear-gradient(135deg,#fc4a1a,#f7b733)}
.bh7{background:linear-gradient(135deg,#0f2027,#2c5364)}
.block-body{padding:20px 28px 28px}

.caso-tag{display:inline-block;font-size:.7em;font-weight:700;padding:3px 10px;border-radius:20px;color:#fff;margin-bottom:10px}
.caso h4{font-size:1.05em;color:#1a1a2e;margin-bottom:10px}
.caso .escenario{font-style:italic;color:#555;margin-bottom:12px;font-size:.95em}
.opts label{display:block;padding:10px 14px;margin:5px 0;background:#fff;border:2px solid #e0e0e0;border-radius:8px;cursor:pointer;transition:.25s;font-size:.95em}
.opts label:hover{border-color:#667eea;background:#f5f3ff}
.opts input[type=radio]{margin-right:8px;accent-color:#667eea}
.opts label.sel{border-color:#667eea;background:#ede9fe}
.opts label.correct{border-color:#2e7d32;background:#e8f5e9}
.opts label.wrong{border-color:#c62828;background:#ffebee}

.explicacion-user:focus{border-color:#667eea;outline:none}

.btn-val:hover{background:#5a6fd6}
.btn-val:disabled{background:#bbb;cursor:default}
.feedback{margin-top:10px;padding:12px 16px;border-radius:8px;font-size:.92em;display:none;line-height:1.6}
.feedback.ok{display:block;background:#e8f5e9;border-left:4px solid #2e7d32;color:#1b5e20}
.feedback.bad{display:block;background:#ffebee;border-left:4px solid #c62828;color:#b71c1c}

.btn-prev{background:#78909c}
.btn-next{background:#667eea}

@media print{

 q:{es:"Justo antes de salir a escena, el corazón de Ana late muy deprisa y sus músculos están tensos, listos para el primer paso. ¿Qué sistema de regulación ha activado esta respuesta rápida?",
    ca:"Just abans de sortir a escena, el cor de l'Ana batega molt de pressa i els seus músculs estan tensos, a punt per al primer pas. Quin sistema de regulació ha activat aquesta resposta ràpida?",
    en:"Just before going on stage, Ana's heart beats very fast and her muscles are tense, ready for the first step. Which regulatory system has activated this rapid response?"},
 opts:{es:["a) El sistema endocrino, liberando insulina","b) El sistema nervioso, mediante impulsos eléctricos rápidos","c) El sistema digestivo, absorbiendo nutrientes","d) El sistema linfático, drenando líquidos"],
       ca:["a) El sistema endocrí, alliberant insulina","b) El sistema nerviós, mitjançant impulsos elèctrics ràpids","c) El sistema digestiu, absorbint nutrients","d) El sistema limfàtic, drenant líquids"],
       en:["a) The endocrine system, releasing insulin","b) The nervous system, through rapid electrical impulses","c) The digestive system, absorbing nutrients","d) The lymphatic system, draining fluids"]},
 correct:1,
 expl:{es:"El sistema nervioso genera respuestas rápidas y precisas mediante impulsos eléctricos (Diapositiva 5). La activación inmediata del corazón y los músculos antes de salir a escena es una respuesta nerviosa. El sistema endocrino actúa más lentamente (hormonas).",
       ca:"El sistema nerviós genera respostes ràpides i precises mitjançant impulsos elèctrics (Diapositiva 5). L'activació immediata del cor i els músculs abans de sortir a escena és una resposta nerviosa. El sistema endocrí actua més lentament (hormones).",
       en:"The nervous system generates rapid and precise responses through electrical impulses (Slide 5). The immediate activation of the heart and muscles before going on stage is a nervous response. The endocrine system acts more slowly (hormones)."}},

{block:0, tagColor:"#667eea",
 tag:{es:"Homeostasis",ca:"Homeòstasi",en:"Homeostasis"},
 ref:{es:"Presentación I · Diapositiva 6",ca:"Presentació I · Diapositiva 6",en:"Presentation I · Slide 6"},
 q:{es:"Después de una clase intensa de 90 minutos, la professora pide a las alumnas que se tumben en el suelo y respiren lentamente durante 5 minutos. Desde el punto de vista fisiológico, ¿por qué es importante este reposo?",
    ca:"Després d'una classe intensa de 90 minuts, la professora demana a les alumnes que es tombin a terra i respirin lentament durant 5 minuts. Des del punt de vista fisiològic, per què és important aquest repòs?",
    en:"After an intense 90-minute class, the teacher asks the students to lie on the floor and breathe slowly for 5 minutes. From a physiological point of view, why is this rest important?"},
 opts:{es:["a) Para que los músculos se queden rígidos y mantengan la forma","b) Para que el cuerpo restaure las condiciones homeostáticas del medio interno (LEC)","c) Para que la glucosa baje a cero","d) Para que el sistema nervioso se desconecte completamente"],
       ca:["a) Perquè els músculs es quedin rígids i mantinguin la forma","b) Perquè el cos restauri les condicions homeostàtiques del medi intern (LEC)","c) Perquè la glucosa baixi a zero","d) Perquè el sistema nerviós es desconnecti completament"],
       en:["a) So muscles become stiff and keep their shape","b) So the body restores the homeostatic conditions of the internal environment (ECF)","c) So glucose drops to zero","d) So the nervous system completely disconnects"]},
 correct:1,
 expl:{es:"La actividad física rompe el equilibrio del medio interno (LEC). El período de reposo permite restaurar las condiciones homeostáticas: normalizar pH, temperatura, glucosa, etc. (Diapositiva 6: Homeostasis en el movimiento).",
       ca:"L'activitat física trenca l'equilibri del medi intern (LEC). El període de repòs permet restaurar les condicions homeostàtiques: normalitzar pH, temperatura, glucosa, etc. (Diapositiva 6: Homeòstasi en el moviment).",
       en:"Physical activity disrupts the internal environment (ECF) balance. The rest period allows restoring homeostatic conditions: normalizing pH, temperature, glucose, etc. (Slide 6: Homeostasis in movement)."}},

{block:0, tagColor:"#667eea",
 tag:{es:"Homeostasis",ca:"Homeòstasi",en:"Homeostasis"},
 ref:{es:"Presentación I · Diapositiva 7",ca:"Presentació I · Diapositiva 7",en:"Presentation I · Slide 7"},
 q:{es:"Durante el parto, las contracciones uterinas provocan la liberación de oxitocina, que a su vez provoca contracciones más fuertes, que liberan más oxitocina, hasta que se produce el nacimiento. ¿Qué tipo de mecanismo es este?",
    ca:"Durant el part, les contraccions uterines provoquen l'alliberament d'oxitocina, que al seu torn provoca contraccions més fortes, que alliberen més oxitocina, fins que es produeix el naixement. Quin tipus de mecanisme és aquest?",
    en:"During childbirth, uterine contractions trigger the release of oxytocin, which in turn causes stronger contractions, which release more oxytocin, until birth occurs. What type of mechanism is this?"},
 opts:{es:["a) Retroalimentación negativa","b) Homeostasis pasiva","c) Retroalimentación positiva","d) Regulación endocrina lenta"],
       ca:["a) Retroalimentació negativa","b) Homeòstasi passiva","c) Retroalimentació positiva","d) Regulació endocrina lenta"],
       en:["a) Negative feedback","b) Passive homeostasis","c) Positive feedback","d) Slow endocrine regulation"]},
 correct:2,
 expl:{es:"En la retroalimentación positiva, la respuesta amplifica el estímulo inicial, alejando la variable del punto de ajuste hasta completar un proceso (Diapositiva 7). Las contracciones del parto son el ejemplo clásico.",
       ca:"En la retroalimentació positiva, la resposta amplifica l'estímul inicial, allunyant la variable del punt d'ajust fins a completar un procés (Diapositiva 7). Les contraccions del part són l'exemple clàssic.",
       en:"In positive feedback, the response amplifies the initial stimulus, moving the variable away from the set point until a process is completed (Slide 7). Labor contractions are the classic example."}},

{block:0, tagColor:"#667eea",
 tag:{es:"Homeostasis",ca:"Homeòstasi",en:"Homeostasis"},
 ref:{es:"Presentación I · Diapositiva 4",ca:"Presentació I · Diapositiva 4",en:"Presentation I · Slide 4"},
 q:{es:"Un bailarín llega a urgencias después de un ensayo bajo el sol sin beber agua. Su presión arterial es 85/50 mmHg. ¿Qué indica este valor?",
    ca:"Un ballarí arriba a urgències després d'un assaig sota el sol sense beure aigua. La seva pressió arterial és 85/50 mmHg. Què indica aquest valor?",
    en:"A dancer arrives at the emergency room after rehearsing in the sun without drinking water. His blood pressure is 85/50 mmHg. What does this value indicate?"},
 opts:{es:["a) Está dentro del rango normal (120/80 mmHg)","b) Está por debajo del rango normal; puede indicar deshidratación","c) Está por encima del rango normal; tiene hipertensión","d) La presión arterial no se ve afectada por la hidratación"],
       ca:["a) Està dins del rang normal (120/80 mmHg)","b) Està per sota del rang normal; pot indicar deshidratació","c) Està per sobre del rang normal; té hipertensió","d) La pressió arterial no es veu afectada per la hidratació"],
       en:["a) It's within the normal range (120/80 mmHg)","b) It's below the normal range; may indicate dehydration","c) It's above the normal range; he has hypertension","d) Blood pressure is not affected by hydration"]},
 correct:1,
 expl:{es:"La presión arterial normal es aproximadamente 120/80 mmHg (Diapositiva 4). Un valor de 85/50 está muy por debajo, lo que sugiere deshidratación y pérdida de volumen de líquido extracelular.",
       ca:"La pressió arterial normal és aproximadament 120/80 mmHg (Diapositiva 4). Un valor de 85/50 està molt per sota, cosa que suggereix deshidratació i pèrdua de volum de líquid extracel·lular.",
       en:"Normal blood pressure is approximately 120/80 mmHg (Slide 4). A value of 85/50 is well below, suggesting dehydration and loss of extracellular fluid volume."}},

{block:0, tagColor:"#667eea",
 tag:{es:"Homeostasis",ca:"Homeòstasi",en:"Homeostasis"},
 ref:{es:"Presentación I · Diapositiva 3",ca:"Presentació I · Diapositiva 3",en:"Presentation I · Slide 3"},
 q:{es:"¿Cuál de las siguientes afirmaciones sobre el líquido extracelular (LEC) es correcta?",
    ca:"Quina de les següents afirmacions sobre el líquid extracel·lular (LEC) és correcta?",
    en:"Which of the following statements about extracellular fluid (ECF) is correct?"},
 opts:{es:["a) Representa el 60-65% del agua corporal total","b) Es el medio interno donde viven las células y constituye el 35-40% del agua corporal","c) Se encuentra exclusivamente dentro de los vasos sanguíneos","d) No participa en la homeostasis"],
       ca:["a) Representa el 60-65% de l'aigua corporal total","b) És el medi intern on viuen les cèl·lules i constitueix el 35-40% de l'aigua corporal","c) Es troba exclusivament dins dels vasos sanguinis","d) No participa en l'homeòstasi"],
       en:["a) It represents 60-65% of total body water","b) It is the internal environment where cells live and constitutes 35-40% of body water","c) It is found exclusively inside blood vessels","d) It does not participate in homeostasis"]},
 correct:1,
 expl:{es:"El LEC constituye el 35-40% del agua corporal total y es el «medio interno» que baña las células. El 60-65% corresponde al líquido intracelular (LIC) (Diapositiva 3).",
       ca:"El LEC constitueix el 35-40% de l'aigua corporal total i és el «medi intern» que banya les cèl·lules. El 60-65% correspon al líquid intracel·lular (LIC) (Diapositiva 3).",
       en:"The ECF constitutes 35-40% of total body water and is the 'internal environment' that bathes the cells. 60-65% corresponds to intracellular fluid (ICF) (Slide 3)."}},

{block:0, tagColor:"#667eea",
 tag:{es:"Homeostasis",ca:"Homeòstasi",en:"Homeostasis"},
 ref:{es:"Presentación I · Diapositiva 5",ca:"Presentació I · Diapositiva 5",en:"Presentation I · Slide 5"},
 q:{es:"Durante una función de 2 horas, el cuerpo de un bailarín libera adrenalina de forma sostenida para mantener el estado de alerta. ¿Qué sistema de regulación es responsable de esta respuesta prolongada?",
    ca:"Durant una funció de 2 hores, el cos d'un ballarí allibera adrenalina de forma sostinguda per mantenir l'estat d'alerta. Quin sistema de regulació és responsable d'aquesta resposta prolongada?",
    en:"During a 2-hour performance, a dancer's body releases adrenaline steadily to maintain alertness. Which regulatory system is responsible for this prolonged response?"},
 opts:{es:["a) El sistema nervioso somático","b) El sistema endocrino, mediante hormonas transportadas por la sangre","c) El sistema muscular, mediante contracciones","d) El sistema óseo, mediante remodelación"],
       ca:["a) El sistema nerviós somàtic","b) El sistema endocrí, mitjançant hormones transportades per la sang","c) El sistema muscular, mitjançant contraccions","d) El sistema ossi, mitjançant remodelació"],
       en:["a) The somatic nervous system","b) The endocrine system, through hormones transported by the blood","c) The muscular system, through contractions","d) The skeletal system, through remodeling"]},
 correct:1,
 expl:{es:"El sistema endocrino produce respuestas lentas pero duraderas mediante hormonas como la adrenalina, que viajan por la sangre (Diapositiva 5). El sistema nervioso actúa más rápido pero de forma más breve.",
       ca:"El sistema endocrí produeix respostes lentes però duradores mitjançant hormones com l'adrenalina, que viatgen per la sang (Diapositiva 5). El sistema nerviós actua més ràpid però de forma més breu.",
       en:"The endocrine system produces slow but lasting responses through hormones such as adrenaline, which travel through the blood (Slide 5). The nervous system acts faster but more briefly."}},

{block:0, tagColor:"#667eea",
 tag:{es:"Homeostasis",ca:"Homeòstasi",en:"Homeostasis"},
 ref:{es:"Presentación I · Diapositiva 4",ca:"Presentació I · Diapositiva 4",en:"Presentation I · Slide 4"},
 q:{es:"Después de un ejercicio muy intenso, el pH sanguíneo de un bailarín baja temporalmente a 7,30. ¿Qué significa esto?",
    ca:"Després d'un exercici molt intens, el pH sanguini d'un ballarí baixa temporalment a 7,30. Què significa això?",
    en:"After very intense exercise, a dancer's blood pH temporarily drops to 7.30. What does this mean?"},
 opts:{es:["a) Que su sangre se ha vuelto demasiado básica (alcalina)","b) Que su sangre se ha vuelto ligeramente más ácida de lo normal (rango: 7,35-7,45)","c) Que su pH es completamente normal","d) Que la glucosa ha subido demasiado"],
       ca:["a) Que la seva sang s'ha tornat massa bàsica (alcalina)","b) Que la seva sang s'ha tornat lleugerament més àcida del normal (rang: 7,35-7,45)","c) Que el seu pH és completament normal","d) Que la glucosa ha pujat massa"],
       en:["a) That his blood has become too basic (alkaline)","b) That his blood has become slightly more acidic than normal (range: 7.35-7.45)","c) That his pH is completely normal","d) That glucose has risen too much"]},
 correct:1,
 expl:{es:"El pH normal es 7,35-7,45 (Diapositiva 4). Un valor de 7,30 está por debajo del rango, lo que indica acidosis leve, probablemente por acumulación de CO₂ y ácido láctico durante el ejercicio intenso.",
       ca:"El pH normal és 7,35-7,45 (Diapositiva 4). Un valor de 7,30 està per sota del rang, cosa que indica acidosi lleu, probablement per acumulació de CO₂ i àcid làctic durant l'exercici intens.",
       en:"Normal pH is 7.35-7.45 (Slide 4). A value of 7.30 is below the range, indicating mild acidosis, probably from CO₂ and lactic acid accumulation during intense exercise."}},

{block:1, tagColor:"#11998e",
 tag:{es:"Músculo y Sarcómero",ca:"Múscul i Sarcòmer",en:"Muscle and Sarcomere"},
 ref:{es:"Presentación I · Diapositiva 8",ca:"Presentació I · Diapositiva 8",en:"Presentation I · Slide 8"},
 q:{es:"Una bailarina utiliza sus cuádriceps para saltar, su corazón para bombear sangre y su estómago para digerir la comida. ¿Qué tipos de tejido muscular corresponden a cada acción, en ese orden?",
    ca:"Una ballarina utilitza els seus quàdriceps per saltar, el seu cor per bombar sang i el seu estómac per digerir el menjar. Quins tipus de teixit muscular corresponen a cada acció, en aquest ordre?",
    en:"A dancer uses her quadriceps to jump, her heart to pump blood and her stomach to digest food. What types of muscle tissue correspond to each action, in that order?"},
 opts:{es:["a) Liso, cardíaco, esquelético","b) Esquelético, liso, cardíaco","c) Esquelético, cardíaco, liso","d) Cardíaco, esquelético, liso"],
       ca:["a) Llis, cardíac, esquelètic","b) Esquelètic, llis, cardíac","c) Esquelètic, cardíac, llis","d) Cardíac, esquelètic, llis"],
       en:["a) Smooth, cardiac, skeletal","b) Skeletal, smooth, cardiac","c) Skeletal, cardiac, smooth","d) Cardiac, skeletal, smooth"]},
 correct:2,
 expl:{es:"Cuádriceps = músculo esquelético (voluntario). Corazón = músculo cardíaco (involuntario, estriado). Estómago = músculo liso (involuntario, no estriado) (Diapositiva 8).",
       ca:"Quàdriceps = múscul esquelètic (voluntari). Cor = múscul cardíac (involuntari, estriat). Estómac = múscul llis (involuntari, no estriat) (Diapositiva 8).",
       en:"Quadriceps = skeletal muscle (voluntary). Heart = cardiac muscle (involuntary, striated). Stomach = smooth muscle (involuntary, non-striated) (Slide 8)."}},

{block:1, tagColor:"#11998e",
 tag:{es:"Músculo y Sarcómero",ca:"Múscul i Sarcòmer",en:"Muscle and Sarcomere"},
 ref:{es:"Presentación I · Diapositiva 9",ca:"Presentació I · Diapositiva 9",en:"Presentation I · Slide 9"},
 q:{es:"Al observar una fibra muscular esquelética al microscopio, ¿qué características la distinguen de otras células del cuerpo?",
    ca:"En observar una fibra muscular esquelètica al microscopi, quines característiques la distingeixen d'altres cèl·lules del cos?",
    en:"When observing a skeletal muscle fiber under the microscope, what characteristics distinguish it from other body cells?"},
 opts:{es:["a) Es pequeña, esférica y tiene un solo núcleo","b) Es alargada, cilíndrica y multinucleada","c) Es plana y sin núcleo","d) Tiene forma de estrella con muchas prolongaciones"],
       ca:["a) És petita, esfèrica i té un sol nucli","b) És allargada, cilíndrica i multinucleada","c) És plana i sense nucli","d) Té forma d'estrella amb moltes prolongacions"],
       en:["a) It is small, spherical and has a single nucleus","b) It is elongated, cylindrical and multinucleated","c) It is flat and has no nucleus","d) It has a star shape with many extensions"]},
 correct:1,
 expl:{es:"La fibra muscular esquelética es una célula alargada, cilíndrica y multinucleada (tiene muchos núcleos), lo que la hace única en el cuerpo humano (Diapositiva 9).",
       ca:"La fibra muscular esquelètica és una cèl·lula allargada, cilíndrica i multinucleada (té molts nuclis), cosa que la fa única al cos humà (Diapositiva 9).",
       en:"The skeletal muscle fiber is an elongated, cylindrical, multinucleated cell (it has many nuclei), which makes it unique in the human body (Slide 9)."}},

{block:1, tagColor:"#11998e",
 tag:{es:"Músculo y Sarcómero",ca:"Múscul i Sarcòmer",en:"Muscle and Sarcomere"},
 ref:{es:"Presentación I · Diapositiva 10",ca:"Presentació I · Diapositiva 10",en:"Presentation I · Slide 10"},
 q:{es:"¿Cuál es la unidad funcional y contráctil básica del músculo esquelético?",
    ca:"Quina és la unitat funcional i contràctil bàsica del múscul esquelètic?",
    en:"What is the basic functional and contractile unit of skeletal muscle?"},
 opts:{es:["a) La fibra muscular","b) La miofibrilla","c) El sarcómero","d) El miofilamento de actina"],
       ca:["a) La fibra muscular","b) La miofibril·la","c) El sarcòmer","d) El miofilament d'actina"],
       en:["a) The muscle fiber","b) The myofibril","c) The sarcomere","d) The actin myofilament"]},
 correct:2,
 expl:{es:"El sarcómero es la unidad funcional y contráctil básica, definido como el segmento entre dos líneas Z consecutivas (Diapositiva 10).",
       ca:"El sarcòmer és la unitat funcional i contràctil bàsica, definit com el segment entre dues línies Z consecutives (Diapositiva 10).",
       en:"The sarcomere is the basic functional and contractile unit, defined as the segment between two consecutive Z lines (Slide 10)."}},

{block:1, tagColor:"#11998e",
 tag:{es:"Músculo y Sarcómero",ca:"Múscul i Sarcòmer",en:"Muscle and Sarcomere"},
 ref:{es:"Presentación I · Diapositiva 11",ca:"Presentació I · Diapositiva 11",en:"Presentation I · Slide 11"},
 q:{es:"Durante una contracción muscular, ¿qué ocurre con la Banda A del sarcómero?",
    ca:"Durant una contracció muscular, què passa amb la Banda A del sarcòmer?",
    en:"During muscle contraction, what happens to the A Band of the sarcomere?"},
 opts:{es:["a) Se estrecha hasta desaparecer","b) Se alarga el doble","c) Permanece constante, ya que corresponde a la longitud de la miosina","d) Se divide en dos bandas más pequeñas"],
       ca:["a) S'estreny fins a desaparèixer","b) S'allarga el doble","c) Roman constant, ja que correspon a la longitud de la miosina","d) Es divideix en dues bandes més petites"],
       en:["a) It narrows until it disappears","b) It doubles in length","c) It remains constant, as it corresponds to the length of myosin","d) It splits into two smaller bands"]},
 correct:2,
 expl:{es:"La Banda A (longitud de los filamentos gruesos de miosina) permanece constante durante la contracción. Lo que se estrecha es la Banda I, al acercarse las líneas Z (Diapositiva 11).",
       ca:"La Banda A (longitud dels filaments gruixuts de miosina) roman constant durant la contracció. El que s'estreny és la Banda I, en acostar-se les línies Z (Diapositiva 11).",
       en:"The A Band (length of the thick myosin filaments) remains constant during contraction. What narrows is the I Band, as the Z lines come closer (Slide 11)."}},

{block:1, tagColor:"#11998e",
 tag:{es:"Músculo y Sarcómero",ca:"Múscul i Sarcòmer",en:"Muscle and Sarcomere"},
 ref:{es:"Presentación I · Diapositiva 11",ca:"Presentació I · Diapositiva 11",en:"Presentation I · Slide 11"},
 q:{es:"Cuando un bailarín contrae su bíceps braquial para levantar el brazo en un <em>port de bras</em>, ¿qué ocurre con la Banda I de sus sarcómeros?",
    ca:"Quan un ballarí contreu el seu bíceps braquial per aixecar el braç en un <em>port de bras</em>, què passa amb la Banda I dels seus sarcòmers?",
    en:"When a dancer contracts his biceps brachii to lift his arm in a <em>port de bras</em>, what happens to the I Band of his sarcomeres?"},
 opts:{es:["a) Se ensancha porque las líneas Z se separan","b) Se estrecha porque las líneas Z se acercan","c) No cambia en absoluto","d) Desaparece y se convierte en Banda A"],
       ca:["a) S'eixampla perquè les línies Z se separen","b) S'estreny perquè les línies Z s'acosten","c) No canvia en absolut","d) Desapareix i es converteix en Banda A"],
       en:["a) It widens because the Z lines separate","b) It narrows because the Z lines come closer","c) It doesn't change at all","d) It disappears and becomes the A Band"]},
 correct:1,
 expl:{es:"Durante la contracción, los filamentos de actina se deslizan hacia el centro del sarcómero, acercando las líneas Z entre sí. Esto hace que la Banda I (zona de solo actina) se estreche (Diapositiva 11).",
       ca:"Durant la contracció, els filaments d'actina es llisquen cap al centre del sarcòmer, acostant les línies Z entre si. Això fa que la Banda I (zona de només actina) s'estrenyi (Diapositiva 11).",
       en:"During contraction, actin filaments slide toward the center of the sarcomere, bringing the Z lines closer together. This causes the I Band (actin-only zone) to narrow (Slide 11)."}},

{block:1, tagColor:"#11998e",
 tag:{es:"Músculo y Sarcómero",ca:"Múscul i Sarcòmer",en:"Muscle and Sarcomere"},
 ref:{es:"Presentación I · Diapositiva 10",ca:"Presentació I · Diapositiva 10",en:"Presentation I · Slide 10"},
 q:{es:"¿Cuáles son los dos tipos de miofilamentos que componen el sarcómero?",
    ca:"Quins són els dos tipus de miofilaments que componen el sarcòmer?",
    en:"What are the two types of myofilaments that make up the sarcomere?"},
 opts:{es:["a) Colágeno (grueso) y elastina (delgado)","b) Miosina (grueso) y actina (delgado)","c) Queratina (grueso) y tubulina (delgado)","d) Fibrina (grueso) y globulina (delgado)"],
       ca:["a) Col·lagen (gruixut) i elastina (prim)","b) Miosina (gruixut) i actina (prim)","c) Queratina (gruixut) i tubulina (prim)","d) Fibrina (gruixut) i globulina (prim)"],
       en:["a) Collagen (thick) and elastin (thin)","b) Myosin (thick) and actin (thin)","c) Keratin (thick) and tubulin (thin)","d) Fibrin (thick) and globulin (thin)"]},
 correct:1,
 expl:{es:"Los miofilamentos gruesos están formados por miosina y los delgados por actina. Su interacción produce la contracción muscular (Diapositiva 10).",
       ca:"Els miofilaments gruixuts estan formats per miosina i els prims per actina. La seva interacció produeix la contracció muscular (Diapositiva 10).",
       en:"Thick myofilaments are made of myosin and thin ones of actin. Their interaction produces muscle contraction (Slide 10)."}},

{block:1, tagColor:"#11998e",
 tag:{es:"Músculo y Sarcómero",ca:"Múscul i Sarcòmer",en:"Muscle and Sarcomere"},
 ref:{es:"Presentación I · Diapositiva 11",ca:"Presentació I · Diapositiva 11",en:"Presentation I · Slide 11"},
 q:{es:"Se estima que el músculo bíceps braquial contiene aproximadamente 100.000 sarcómeros alineados en serie. ¿Qué implica esto para la contracción?",
    ca:"S'estima que el múscul bíceps braquial conté aproximadament 100.000 sarcòmers alineats en sèrie. Què implica això per a la contracció?",
    en:"The biceps brachii muscle is estimated to contain approximately 100,000 sarcomeres aligned in series. What does this imply for contraction?"},
 opts:{es:["a) Que cada sarcómero se contrae de forma independiente y desordenada","b) Que el acortamiento de cada sarcómero se suma, produciendo un acortamiento total significativo del músculo","c) Que solo se contraen los sarcómeros de los extremos","d) Que los sarcómeros se alargan durante la contracción"],
       ca:["a) Que cada sarcòmer es contreu de forma independent i desordenada","b) Que l'escurçament de cada sarcòmer se suma, produint un escurçament total significatiu del múscul","c) Que només es contreuen els sarcòmers dels extrems","d) Que els sarcòmers s'allarguen durant la contracció"],
       en:["a) That each sarcomere contracts independently and disorderly","b) That the shortening of each sarcomere adds up, producing a significant total shortening of the muscle","c) That only the sarcomeres at the ends contract","d) That the sarcomeres lengthen during contraction"]},
 correct:1,
 expl:{es:"Al estar en serie, el pequeño acortamiento de cada uno de los ~100.000 sarcómeros se suma, produciendo un acortamiento total apreciable del músculo completo (Diapositiva 11).",
       ca:"En estar en sèrie, el petit escurçament de cadascun dels ~100.000 sarcòmers se suma, produint un escurçament total apreciable del múscul complet (Diapositiva 11).",
       en:"Being in series, the small shortening of each of the ~100,000 sarcomeres adds up, producing an appreciable total shortening of the complete muscle (Slide 11)."}},

{block:1, tagColor:"#11998e",
 tag:{es:"Músculo y Sarcómero",ca:"Múscul i Sarcòmer",en:"Muscle and Sarcomere"},
 ref:{es:"Presentación I · Diapositiva 10",ca:"Presentació I · Diapositiva 10",en:"Presentation I · Slide 10"},
 q:{es:"Ordena de mayor a menor las siguientes estructuras del músculo esquelético:",
    ca:"Ordena de major a menor les següents estructures del múscul esquelètic:",
    en:"Order from largest to smallest the following skeletal muscle structures:"},
 opts:{es:["a) Miofilamento → Sarcómero → Miofibrilla → Fibra muscular","b) Fibra muscular → Miofibrilla → Sarcómero → Miofilamento","c) Sarcómero → Fibra muscular → Miofilamento → Miofibrilla","d) Miofibrilla → Fibra muscular → Miofilamento → Sarcómero"],
       ca:["a) Miofilament → Sarcòmer → Miofibril·la → Fibra muscular","b) Fibra muscular → Miofibril·la → Sarcòmer → Miofilament","c) Sarcòmer → Fibra muscular → Miofilament → Miofibril·la","d) Miofibril·la → Fibra muscular → Miofilament → Sarcòmer"],
       en:["a) Myofilament → Sarcomere → Myofibril → Muscle fiber","b) Muscle fiber → Myofibril → Sarcomere → Myofilament","c) Sarcomere → Muscle fiber → Myofilament → Myofibril","d) Myofibril → Muscle fiber → Myofilament → Sarcomere"]},
 correct:1,
 expl:{es:"La jerarquía de mayor a menor es: Fibra muscular (célula) → Miofibrilla (orgánulo) → Sarcómero (unidad funcional) → Miofilamento (proteína: actina/miosina) (Diapositiva 10).",
       ca:"La jerarquia de major a menor és: Fibra muscular (cèl·lula) → Miofibril·la (orgànul) → Sarcòmer (unitat funcional) → Miofilament (proteïna: actina/miosina) (Diapositiva 10).",
       en:"The hierarchy from largest to smallest is: Muscle fiber (cell) → Myofibril (organelle) → Sarcomere (functional unit) → Myofilament (protein: actin/myosin) (Slide 10)."}},

{block:1, tagColor:"#11998e",
 tag:{es:"Músculo y Sarcómero",ca:"Múscul i Sarcòmer",en:"Muscle and Sarcomere"},
 ref:{es:"Presentación I · Diapositiva 8",ca:"Presentació I · Diapositiva 8",en:"Presentation I · Slide 8"},
 q:{es:"¿Cuál de las siguientes NO es una función del músculo esquelético?",
    ca:"Quina de les següents NO és una funció del múscul esquelètic?",
    en:"Which of the following is NOT a function of skeletal muscle?"},
 opts:{es:["a) Movimiento voluntario","b) Mantenimiento de la postura","c) Bombeo involuntario de la sangre","d) Termorregulación (generación de calor)"],
       ca:["a) Moviment voluntari","b) Manteniment de la postura","c) Bombament involuntari de la sang","d) Termoregulació (generació de calor)"],
       en:["a) Voluntary movement","b) Maintaining posture","c) Involuntary pumping of blood","d) Thermoregulation (heat generation)"]},
 correct:2,
 expl:{es:"El bombeo involuntario de la sangre es función del músculo cardíaco, no del esquelético. El músculo esquelético sí participa en movimiento voluntario, postura, locomoción, circulación (retorno venoso) y termorregulación (Diapositiva 8).",
       ca:"El bombament involuntari de la sang és funció del múscul cardíac, no de l'esquelètic. El múscul esquelètic sí que participa en moviment voluntari, postura, locomoció, circulació (retorn venós) i termoregulació (Diapositiva 8).",
       en:"Involuntary blood pumping is a function of cardiac muscle, not skeletal. Skeletal muscle does participate in voluntary movement, posture, locomotion, circulation (venous return) and thermoregulation (Slide 8)."}},

{block:1, tagColor:"#11998e",
 tag:{es:"Músculo y Sarcómero",ca:"Múscul i Sarcòmer",en:"Muscle and Sarcomere"},
 ref:{es:"Presentación I · Diapositiva 11",ca:"Presentació I · Diapositiva 11",en:"Presentation I · Slide 11"},
 q:{es:"¿Qué estructuras delimitan un sarcómero?",
    ca:"Quines estructures delimiten un sarcòmer?",
    en:"What structures delimit a sarcomere?"},
 opts:{es:["a) Dos bandas A consecutivas","b) Dos líneas Z consecutivas","c) Una banda I y una banda H","d) Dos discos intercalares"],
       ca:["a) Dues bandes A consecutives","b) Dues línies Z consecutives","c) Una banda I i una banda H","d) Dos discs intercalats"],
       en:["a) Two consecutive A bands","b) Two consecutive Z lines","c) An I band and an H band","d) Two intercalated discs"]},
 correct:1,
 expl:{es:"El sarcómero se define como el segmento comprendido entre dos líneas Z consecutivas. Las líneas Z son los puntos de anclaje de los filamentos de actina (Diapositiva 11).",
       ca:"El sarcòmer es defineix com el segment comprès entre dues línies Z consecutives. Les línies Z són els punts d'ancoratge dels filaments d'actina (Diapositiva 11).",
       en:"The sarcomere is defined as the segment between two consecutive Z lines. The Z lines are the anchoring points of the actin filaments (Slide 11)."}},

// ─── BLOQUE 3 ───
{block:2, tagColor:"#ee5a6f",
 tag:{es:"Contracción y Unidad Motora",ca:"Contracció i Unitat Motora",en:"Contraction and Motor Unit"},
 ref:{es:"Presentación I · Diapositiva 12",ca:"Presentació I · Diapositiva 12",en:"Presentation I · Slide 12"},
 q:{es:"¿Qué es una unidad motora?",
    ca:"Què és una unitat motora?",
    en:"What is a motor unit?"},
 opts:{es:["a) Todo el músculo esquelético y su nervio principal","b) Una motoneurona junto con todas las fibras musculares que inerva","c) Un sarcómero y su línea Z","d) La unión entre dos músculos sinergistas"],
       ca:["a) Tot el múscul esquelètic i el seu nervi principal","b) Una motoneurona juntament amb totes les fibres musculars que innerva","c) Un sarcòmer i la seva línia Z","d) La unió entre dos músculs sinergistes"],
       en:["a) The entire skeletal muscle and its main nerve","b) A motor neuron together with all the muscle fibers it innervates","c) A sarcomere and its Z line","d) The union between two synergist muscles"]},
 correct:1,
 expl:{es:"La unidad motora está formada por una motoneurona (del asta anterior de la médula espinal) y el conjunto de fibras musculares que esa neurona controla (Diapositiva 12).",
       ca:"La unitat motora està formada per una motoneurona (de l'asta anterior de la medul·la espinal) i el conjunt de fibres musculars que aquesta neurona controla (Diapositiva 12).",
       en:"The motor unit is formed by a motor neuron (from the anterior horn of the spinal cord) and the set of muscle fibers that neuron controls (Slide 12)."}},

{block:2, tagColor:"#ee5a6f",
 tag:{es:"Contracción y Unidad Motora",ca:"Contracció i Unitat Motora",en:"Contraction and Motor Unit"},
 ref:{es:"Presentación I · Diapositiva 12",ca:"Presentació I · Diapositiva 12",en:"Presentation I · Slide 12"},
 q:{es:"¿Dónde se encuentran las motoneuronas que dan la orden de contracción a los músculos esqueléticos?",
    ca:"On es troben les motoneurones que donen l'ordre de contracció als músculs esquelètics?",
    en:"Where are the motor neurons that give the contraction order to skeletal muscles located?"},
 opts:{es:["a) En la corteza cerebral exclusivamente","b) En el asta anterior de la médula espinal","c) En los ganglios linfáticos","d) En el interior de las fibras musculares"],
       ca:["a) A l'escorça cerebral exclusivament","b) A l'asta anterior de la medul·la espinal","c) Als ganglis limfàtics","d) A l'interior de les fibres musculars"],
       en:["a) Exclusively in the cerebral cortex","b) In the anterior horn of the spinal cord","c) In the lymph nodes","d) Inside the muscle fibers"]},
 correct:1,
 expl:{es:"Las motoneuronas que inervan el músculo esquelético tienen su cuerpo celular en el asta anterior de la médula espinal (Diapositiva 12). Desde allí, su axón viaja hasta el músculo.",
       ca:"Les motoneurones que innerven el múscul esquelètic tenen el seu cos cel·lular a l'asta anterior de la medul·la espinal (Diapositiva 12). Des d'allà, el seu axó viatja fins al múscul.",
       en:"The motor neurons that innervate skeletal muscle have their cell body in the anterior horn of the spinal cord (Slide 12). From there, their axon travels to the muscle."}},

{block:2, tagColor:"#ee5a6f",
 tag:{es:"Contracción y Unidad Motora",ca:"Contracció i Unitat Motora",en:"Contraction and Motor Unit"},
 ref:{es:"Presentación I · Diapositiva 13",ca:"Presentació I · Diapositiva 13",en:"Presentation I · Slide 13"},
 q:{es:"En la unión neuromuscular, ¿qué sustancia química se libera desde la terminal del nervio para transmitir la señal a la fibra muscular?",
    ca:"A la unió neuromuscular, quina substància química s'allibera des de la terminal del nervi per transmetre el senyal a la fibra muscular?",
    en:"At the neuromuscular junction, what chemical substance is released from the nerve terminal to transmit the signal to the muscle fiber?"},
 opts:{es:["a) Adrenalina","b) Dopamina","c) Acetilcolina","d) Insulina"],
       ca:["a) Adrenalina","b) Dopamina","c) Acetilcolina","d) Insulina"],
       en:["a) Adrenaline","b) Dopamine","c) Acetylcholine","d) Insulin"]},
 correct:2,
 expl:{es:"La acetilcolina es el neurotransmisor que se libera en la unión neuromuscular (placa motora). Se une a receptores de la fibra muscular y desencadena el potencial de acción que viaja por los túbulos T (Diapositiva 13).",
       ca:"L'acetilcolina és el neurotransmissor que s'allibera a la unió neuromuscular (placa motora). S'uneix a receptors de la fibra muscular i desencadena el potencial d'acció que viatja pels túbuls T (Diapositiva 13).",
       en:"Acetylcholine is the neurotransmitter released at the neuromuscular junction (motor end plate). It binds to receptors on the muscle fiber and triggers the action potential that travels through the T-tubules (Slide 13)."}},

{block:2, tagColor:"#ee5a6f",
 tag:{es:"Contracción y Unidad Motora",ca:"Contracció i Unitat Motora",en:"Contraction and Motor Unit"},
 ref:{es:"Presentación I · Diapositiva 13",ca:"Presentació I · Diapositiva 13",en:"Presentation I · Slide 13"},
 q:{es:"¿Qué ion se libera desde los depósitos internos de la fibra muscular y es imprescindible para que la actina y la miosina se unan?",
    ca:"Quin ió s'allibera des dels dipòsits interns de la fibra muscular i és imprescindible perquè l'actina i la miosina s'uneixin?",
    en:"What ion is released from the internal stores of the muscle fiber and is essential for actin and myosin to bind?"},
 opts:{es:["a) Sodio (Na⁺)","b) Potasio (K⁺)","c) Calcio (Ca²⁺)","d) Cloro (Cl⁻)"],
       ca:["a) Sodi (Na⁺)","b) Potassi (K⁺)","c) Calci (Ca²⁺)","d) Clor (Cl⁻)"],
       en:["a) Sodium (Na⁺)","b) Potassium (K⁺)","c) Calcium (Ca²⁺)","d) Chlorine (Cl⁻)"]},
 correct:2,
 expl:{es:"El calcio (Ca²⁺) se libera desde el retículo sarcoplasmático cuando llega el potencial de acción por los túbulos T. El Ca²⁺ se une a la troponina, descubriendo los sitios de unión de la actina para la miosina (Diapositiva 13).",
       ca:"El calci (Ca²⁺) s'allibera des del reticle sarcoplasmàtic quan arriba el potencial d'acció pels túbuls T. El Ca²⁺ s'uneix a la troponina, descobrint els llocs d'unió de l'actina per a la miosina (Diapositiva 13).",
       en:"Calcium (Ca²⁺) is released from the sarcoplasmic reticulum when the action potential arrives through the T-tubules. Ca²⁺ binds to troponin, exposing the actin binding sites for myosin (Slide 13)."}},

{block:2, tagColor:"#ee5a6f",
 tag:{es:"Contracción y Unidad Motora",ca:"Contracció i Unitat Motora",en:"Contraction and Motor Unit"},
 ref:{es:"Presentación I · Diapositiva 14",ca:"Presentació I · Diapositiva 14",en:"Presentation I · Slide 14"},
 q:{es:"¿Cuál es el papel esencial del ATP en el ciclo de contracción muscular?",
    ca:"Quin és el paper essencial de l'ATP en el cicle de contracció muscular?",
    en:"What is the essential role of ATP in the muscle contraction cycle?"},
 opts:{es:["a) Unir la actina a la miosina de forma permanente","b) Liberar calcio del retículo sarcoplasmático","c) Desacoplar la miosina de la actina para permitir un nuevo ciclo","d) Degradar la acetilcolina en la sinapsis"],
       ca:["a) Unir l'actina a la miosina de forma permanent","b) Alliberar calci del reticle sarcoplasmàtic","c) Desacoblar la miosina de l'actina per permetre un nou cicle","d) Degradar l'acetilcolina a la sinapsi"],
       en:["a) Permanently bind actin to myosin","b) Release calcium from the sarcoplasmic reticulum","c) Uncouple myosin from actin to allow a new cycle","d) Degrade acetylcholine at the synapse"]},
 correct:2,
 expl:{es:"El ATP es necesario para que la cabeza de miosina se suelte de la actina después del golpe de fuerza. Sin ATP, la miosina queda unida a la actina de forma permanente (como ocurre en el rigor mortis) (Diapositiva 14).",
       ca:"L'ATP és necessari perquè el cap de miosina es solti de l'actina després del cop de força. Sense ATP, la miosina queda unida a l'actina de forma permanent (com passa en el rigor mortis) (Diapositiva 14).",
       en:"ATP is necessary for the myosin head to release from actin after the power stroke. Without ATP, myosin remains permanently bound to actin (as occurs in rigor mortis) (Slide 14)."}},

{block:2, tagColor:"#ee5a6f",
 tag:{es:"Contracción y Unidad Motora",ca:"Contracció i Unitat Motora",en:"Contraction and Motor Unit"},
 ref:{es:"Presentación I · Diapositiva 15",ca:"Presentació I · Diapositiva 15",en:"Presentation I · Slide 15"},
 q:{es:"¿Por qué se produce el <em>rigor mortis</em> (rigidez cadavérica) después de la muerte?",
    ca:"Per què es produeix el <em>rigor mortis</em> (rigidesa cadavèrica) després de la mort?",
    en:"Why does <em>rigor mortis</em> (cadaveric rigidity) occur after death?"},
 opts:{es:["a) Porque el calcio desaparece de las células","b) Porque la acetilcolina se acumula en la sinapsis","c) Porque al no haber ATP, la miosina no puede desacoplarse de la actina","d) Porque los huesos se fusionan con los músculos"],
       ca:["a) Perquè el calci desapareix de les cèl·lules","b) Perquè l'acetilcolina s'acumula a la sinapsi","c) Perquè en no haver-hi ATP, la miosina no es pot desacoblar de l'actina","d) Perquè els ossos es fusionen amb els músculs"],
       en:["a) Because calcium disappears from the cells","b) Because acetylcholine accumulates at the synapse","c) Because with no ATP, myosin cannot uncouple from actin","d) Because bones fuse with muscles"]},
 correct:2,
 expl:{es:"Tras la muerte, las células dejan de producir ATP. Sin ATP, las cabezas de miosina no pueden soltarse de la actina, y los músculos quedan rígidos de forma permanente (Diapositiva 15).",
       ca:"Després de la mort, les cèl·lules deixen de produir ATP. Sense ATP, els caps de miosina no es poden soltar de l'actina, i els músculs queden rígids de forma permanent (Diapositiva 15).",
       en:"After death, cells stop producing ATP. Without ATP, myosin heads cannot release from actin, and muscles remain permanently rigid (Slide 15)."}},

{block:2, tagColor:"#ee5a6f",
 tag:{es:"Contracción y Unidad Motora",ca:"Contracció i Unitat Motora",en:"Contraction and Motor Unit"},
 ref:{es:"Presentación I · Diapositiva 15",ca:"Presentació I · Diapositiva 15",en:"Presentation I · Slide 15"},
 q:{es:"Una bailarina ha ensayado 5 horas seguidas sin beber agua ni comer. De repente, su gemelo se contrae de forma involuntaria y dolorosa. ¿Qué cuadro clínico describe mejor esta situación?",
    ca:"Una ballarina ha assajat 5 hores seguides sense beure aigua ni menjar. De sobte, el seu bessó es contreu de forma involuntària i dolorosa. Quin quadre clínic descriu millor aquesta situació?",
    en:"A dancer has rehearsed for 5 hours straight without drinking water or eating. Suddenly, her calf contracts involuntarily and painfully. What clinical condition best describes this situation?"},
 opts:{es:["a) Rigor mortis","b) Rampa muscular (calambre)","c) Fractura por estrés","d) Tendinitis aguda"],
       ca:["a) Rigor mortis","b) Rampa muscular (calambre)","c) Fractura per estrès","d) Tendinitis aguda"],
       en:["a) Rigor mortis","b) Muscle cramp (spasm)","c) Stress fracture","d) Acute tendinitis"]},
 correct:1,
 expl:{es:"Las rampas musculares son contracciones involuntarias causadas por hiperexcitabilidad de la motoneurona alfa, asociadas a fatiga, deshidratación o pérdida de electrolitos (Diapositiva 15).",
       ca:"Les rampes musculars són contraccions involuntàries causades per hiperexcitabilitat de la motoneurona alfa, associades a fatiga, deshidratació o pèrdua d'electròlits (Diapositiva 15).",
       en:"Muscle cramps are involuntary contractions caused by hyperexcitability of the alpha motor neuron, associated with fatigue, dehydration or electrolyte loss (Slide 15)."}},

{block:2, tagColor:"#ee5a6f",
 tag:{es:"Contracción y Unidad Motora",ca:"Contracció i Unitat Motora",en:"Contraction and Motor Unit"},
 ref:{es:"Presentación I · Diapositiva 16",ca:"Presentació I · Diapositiva 16",en:"Presentation I · Slide 16"},
 q:{es:"Durante la fase de subida de un <em>relevé</em>, los gemelos se acortan mientras generan tensión. ¿Qué tipo de contracción es esta?",
    ca:"Durant la fase de pujada d'un <em>relevé</em>, els bessons s'escurcen mentre generen tensió. Quin tipus de contracció és aquesta?",
    en:"During the rising phase of a <em>relevé</em>, the calves shorten while generating tension. What type of contraction is this?"},
 opts:{es:["a) Excéntrica","b) Isométrica","c) Concéntrica","d) Pasiva"],
       ca:["a) Excèntrica","b) Isomètrica","c) Concèntrica","d) Passiva"],
       en:["a) Eccentric","b) Isometric","c) Concentric","d) Passive"]},
 correct:2,
 expl:{es:"En la contracción concéntrica, la tensión generada por el músculo supera la resistencia, y el músculo se acorta. Es lo que ocurre en los gemelos al subir al relevé (Diapositiva 16).",
       ca:"En la contracció concèntrica, la tensió generada pel múscul supera la resistència, i el múscul s'escurça. És el que passa als bessons en pujar al relevé (Diapositiva 16).",
       en:"In a concentric contraction, the tension generated by the muscle exceeds the resistance, and the muscle shortens. This is what happens in the calves when rising to relevé (Slide 16)."}},

{block:2, tagColor:"#ee5a6f",
 tag:{es:"Contracción y Unidad Motora",ca:"Contracció i Unitat Motora",en:"Contraction and Motor Unit"},
 ref:{es:"Presentación I · Diapositiva 16",ca:"Presentació I · Diapositiva 16",en:"Presentation I · Slide 16"},
 q:{es:"Cuando un bailarín baja lentamente desde un <em>relevé</em> controlando el descenso, sus gemelos generan tensión mientras se alargan. ¿Qué tipo de contracción realizan?",
    ca:"Quan un ballarí baixa lentament des d'un <em>relevé</em> controlant el descens, els seus bessons generen tensió mentre s'allarguen. Quin tipus de contracció fan?",
    en:"When a dancer slowly lowers from a <em>relevé</em> controlling the descent, his calves generate tension while lengthening. What type of contraction do they perform?"},
 opts:{es:["a) Concéntrica","b) Isométrica","c) Excéntrica","d) Estática"],
       ca:["a) Concèntrica","b) Isomètrica","c) Excèntrica","d) Estàtica"],
       en:["a) Concentric","b) Isometric","c) Eccentric","d) Static"]},
 correct:2,
 expl:{es:"En la contracción excéntrica, el músculo genera fuerza mientras se alarga (frena el movimiento). Es la fase de descenso controlado del relevé (Diapositiva 16).",
       ca:"En la contracció excèntrica, el múscul genera força mentre s'allarga (frena el moviment). És la fase de descens controlat del relevé (Diapositiva 16).",
       en:"In an eccentric contraction, the muscle generates force while lengthening (braking the movement). It is the controlled descent phase of the relevé (Slide 16)."}},

{block:2, tagColor:"#ee5a6f",
 tag:{es:"Contracción y Unidad Motora",ca:"Contracció i Unitat Motora",en:"Contraction and Motor Unit"},
 ref:{es:"Presentación I · Diapositiva 16",ca:"Presentació I · Diapositiva 16",en:"Presentation I · Slide 16"},
 q:{es:"Una bailarina mantiene un <em>arabesque</em> estático durante 8 tiempos. Su cuádriceps está tenso pero no cambia de longitud. ¿Qué tipo de contracción predomina?",
    ca:"Una ballarina manté un <em>arabesque</em> estàtic durant 8 temps. El seu quàdriceps està tens però no canvia de longitud. Quin tipus de contracció predomina?",
    en:"A dancer holds a static <em>arabesque</em> for 8 counts. Her quadriceps is tense but does not change length. What type of contraction predominates?"},
 opts:{es:["a) Concéntrica","b) Isométrica","c) Excéntrica","d) Balística"],
       ca:["a) Concèntrica","b) Isomètrica","c) Excèntrica","d) Balística"],
       en:["a) Concentric","b) Isometric","c) Eccentric","d) Ballistic"]},
 correct:1,
 expl:{es:"En la contracción isométrica, la tensión generada iguala la resistencia y el músculo no cambia de longitud apreciablemente. Es típica del mantenimiento de posturas estáticas (Diapositiva 16).",
       ca:"En la contracció isomètrica, la tensió generada iguala la resistència i el múscul no canvia de longitud apreciablement. És típica del manteniment de postures estàtiques (Diapositiva 16).",
       en:"In an isometric contraction, the generated tension equals the resistance and the muscle does not appreciably change length. It is typical of holding static postures (Slide 16)."}},

       ca:["a) Cervell, nervis, músculs, ossos, pell","b) Múscul, tendó, os, articulació, lligament","c) Sang, limfa, múscul, os, cartílag","d) Múscul, fàscia, pell, os, nervi"],

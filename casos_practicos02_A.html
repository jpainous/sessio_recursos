 expl:{es:"Los cinco componentes son: Músculo (genera tensión), Tendón (une músculo a hueso), Hueso (palanca), Articulación (permite movimiento) y Ligamento (une hueso con hueso) (Pres II, Sección 1).",
       ca:"Els cinc components són: Múscul (genera tensió), Tendó (uneix múscul a os), Os (palanca), Articulació (permet moviment) i Lligament (uneix os amb os) (Pres II, Secció 1).",
       en:"The five components are: Muscle (generates tension), Tendon (attaches muscle to bone), Bone (lever), Joint (allows movement) and Ligament (connects bone to bone) (Pres II, Section 1)."}},

{block:3, tagColor:"#f7971e",
 tag:{es:"Biomecánica",ca:"Biomecànica",en:"Biomechanics"},
 ref:{es:"Presentación II · Sección 1",ca:"Presentació II · Secció 1",en:"Presentation II · Section 1"},
 q:{es:"¿Cuál es la función principal del tendón en la cadena biomecánica?",
    ca:"Quina és la funció principal del tendó a la cadena biomecànica?",
    en:"What is the main function of the tendon in the biomechanical chain?"},
 opts:{es:["a) Generar la contracción muscular","b) Unir un hueso con otro hueso","c) Unir el músculo al hueso y transmitir la fuerza muscular","d) Producir líquido sinovial"],
       ca:["a) Generar la contracció muscular","b) Unir un os amb un altre os","c) Unir el múscul a l'os i transmetre la força muscular","d) Produir líquid sinovial"],
       en:["a) Generate muscle contraction","b) Connect one bone to another","c) Attach muscle to bone and transmit muscle force","d) Produce synovial fluid"]},
 correct:2,
 expl:{es:"El tendón es tejido conectivo que une el músculo al hueso y transmite la fuerza generada por la contracción muscular hasta el hueso, produciendo el movimiento (Pres II, Sección 1).",
       ca:"El tendó és teixit connectiu que uneix el múscul a l'os i transmet la força generada per la contracció muscular fins a l'os, produint el moviment (Pres II, Secció 1).",
       en:"The tendon is connective tissue that attaches muscle to bone and transmits the force generated by muscle contraction to the bone, producing movement (Pres II, Section 1)."}},

{block:3, tagColor:"#f7971e",
 tag:{es:"Biomecánica",ca:"Biomecànica",en:"Biomechanics"},
 ref:{es:"Presentación II · Sección 1",ca:"Presentació II · Secció 1",en:"Presentation II · Section 1"},
 q:{es:"¿Qué diferencia fundamental hay entre un tendón y un ligamento?",
    ca:"Quina diferència fonamental hi ha entre un tendó i un lligament?",
    en:"What fundamental difference is there between a tendon and a ligament?"},
 opts:{es:["a) El tendón une músculo a hueso; el ligamento une hueso a hueso","b) El tendón une hueso a hueso; el ligamento une músculo a hueso","c) No hay diferencia; son lo mismo","d) El tendón es elástico y el ligamento es rígido"],
       ca:["a) El tendó uneix múscul a os; el lligament uneix os a os","b) El tendó uneix os a os; el lligament uneix múscul a os","c) No hi ha diferència; són el mateix","d) El tendó és elàstic i el lligament és rígid"],
       en:["a) The tendon connects muscle to bone; the ligament connects bone to bone","b) The tendon connects bone to bone; the ligament connects muscle to bone","c) There is no difference; they are the same","d) The tendon is elastic and the ligament is rigid"]},
 correct:0,
 expl:{es:"El tendón une músculo a hueso (transmite fuerza). El ligamento une hueso con hueso (estabiliza y limita el movimiento articular) (Pres II, Sección 1).",
       ca:"El tendó uneix múscul a os (transmet força). El lligament uneix os amb os (estabilitza i limita el moviment articular) (Pres II, Secció 1).",
       en:"The tendon connects muscle to bone (transmits force). The ligament connects bone to bone (stabilizes and limits joint movement) (Pres II, Section 1)."}},

{block:3, tagColor:"#f7971e",
 tag:{es:"Biomecánica",ca:"Biomecànica",en:"Biomechanics"},
 ref:{es:"Presentación II · Sección 2",ca:"Presentació II · Secció 2",en:"Presentation II · Section 2"},
 q:{es:"Cuando decimos que el músculo es el «tejido contráctil» del sistema musculoesquelético, ¿qué significa exactamente?",
    ca:"Quan diem que el múscul és el «teixit contràctil» del sistema musculoesquelètic, què significa exactament?",
    en:"When we say that muscle is the 'contractile tissue' of the musculoskeletal system, what does it mean exactly?"},
 opts:{es:["a) Que es el único tejido que puede estirarse","b) Que es capaz de generar tensión activa para producir, controlar o estabilizar el movimiento","c) Que solo sirve para mover los huesos","d) Que se contrae de forma involuntaria siempre"],
       ca:["a) Que és l'únic teixit que es pot estirar","b) Que és capaç de generar tensió activa per produir, controlar o estabilitzar el moviment","c) Que només serveix per moure els ossos","d) Que es contreu de forma involuntària sempre"],
       en:["a) That it is the only tissue that can stretch","b) That it is capable of generating active tension to produce, control or stabilize movement","c) That it only serves to move bones","d) That it always contracts involuntarily"]},
 correct:1,
 expl:{es:"El músculo esquelético genera tensión activa (mediante la contracción de sus sarcómeros) para producir movimiento, controlarlo o estabilizar las articulaciones (Pres II, Secciones 1 y 2).",
       ca:"El múscul esquelètic genera tensió activa (mitjançant la contracció dels seus sarcòmers) per produir moviment, controlar-lo o estabilitzar les articulacions (Pres II, Seccions 1 i 2).",
       en:"Skeletal muscle generates active tension (through contraction of its sarcomeres) to produce movement, control it or stabilize joints (Pres II, Sections 1 and 2)."}},

{block:3, tagColor:"#f7971e",
 tag:{es:"Biomecánica",ca:"Biomecànica",en:"Biomechanics"},
 ref:{es:"Presentación II · Sección 5",ca:"Presentació II · Secció 5",en:"Presentation II · Section 5"},
 q:{es:"¿Qué es la coactivación muscular?",
    ca:"Què és la coactivació muscular?",
    en:"What is muscle coactivation?"},
 opts:{es:["a) La contracción de un solo músculo de forma aislada","b) El trabajo coordinado y simultáneo de grupos musculares para lograr estabilidad y control postural","c) La relajación total de todos los músculos","d) La contracción involuntaria de un músculo fatigado"],
       ca:["a) La contracció d'un sol múscul de forma aïllada","b) El treball coordinat i simultani de grups musculars per aconseguir estabilitat i control postural","c) La relaxació total de tots els músculs","d) La contracció involuntària d'un múscul fatigat"],
       en:["a) The contraction of a single muscle in isolation","b) The coordinated and simultaneous work of muscle groups to achieve stability and postural control","c) The total relaxation of all muscles","d) The involuntary contraction of a fatigued muscle"]},
 correct:1,
 expl:{es:"La coactivación muscular es el trabajo coordinado de varios grupos musculares (agonistas, antagonistas, sinergistas) que permite la estabilidad y el control postural durante el movimiento (Pres II, Sección 5).",
       ca:"La coactivació muscular és el treball coordinat de diversos grups musculars (agonistes, antagonistes, sinergistes) que permet l'estabilitat i el control postural durant el moviment (Pres II, Secció 5).",
       en:"Muscle coactivation is the coordinated work of several muscle groups (agonists, antagonists, synergists) that allows stability and postural control during movement (Pres II, Section 5)."}},

{block:3, tagColor:"#f7971e",
 tag:{es:"Biomecánica",ca:"Biomecànica",en:"Biomechanics"},
 ref:{es:"Presentación II · Sección 5",ca:"Presentació II · Secció 5",en:"Presentation II · Section 5"},
 q:{es:"Una bailarina mantiene el equilibrio sobre una pierna en <em>passé relevé</em>. ¿Qué mecanismo fisiológico le permite no caerse?",
    ca:"Una ballarina manté l'equilibri sobre una cama en <em>passé relevé</em>. Quin mecanisme fisiològic li permet no caure?",
    en:"A dancer balances on one leg in <em>passé relevé</em>. What physiological mechanism prevents her from falling?"},
 opts:{es:["a) Solo la fuerza del cuádriceps de la pierna de apoyo","b) La coactivación de múltiples grupos musculares (tobillo, cadera, tronco) que ajustan constantemente la postura","c) La rigidez de los huesos del pie","d) La relajación completa de los músculos de la pierna elevada"],
       ca:["a) Només la força del quàdriceps de la cama de suport","b) La coactivació de múltiples grups musculars (turmell, maluc, tronc) que ajusten constantment la postura","c) La rigidesa dels ossos del peu","d) La relaxació completa dels músculs de la cama elevada"],
       en:["a) Only the strength of the supporting leg's quadriceps","b) The coactivation of multiple muscle groups (ankle, hip, trunk) that constantly adjust posture","c) The rigidity of the foot bones","d) The complete relaxation of the raised leg muscles"]},
 correct:1,
 expl:{es:"El equilibrio en una posición compleja requiere la coactivación coordinada de músculos del tobillo, cadera, tronco y core, que realizan microajustes constantes para mantener la estabilidad (Pres II, Sección 5).",
       ca:"L'equilibri en una posició complexa requereix la coactivació coordinada de músculs del turmell, maluc, tronc i core, que fan microajustos constants per mantenir l'estabilitat (Pres II, Secció 5).",
       en:"Balance in a complex position requires coordinated coactivation of ankle, hip, trunk and core muscles, which make constant micro-adjustments to maintain stability (Pres II, Section 5)."}},

{block:3, tagColor:"#f7971e",
 tag:{es:"Biomecánica",ca:"Biomecànica",en:"Biomechanics"},
 ref:{es:"Presentación II · Sección 1",ca:"Presentació II · Secció 1",en:"Presentation II · Section 1"},
 q:{es:"En la cadena biomecánica, ¿qué papel desempeñan los huesos?",
    ca:"A la cadena biomecànica, quin paper fan els ossos?",
    en:"In the biomechanical chain, what role do bones play?"},
 opts:{es:["a) Generar la fuerza del movimiento","b) Actuar como palancas rígidas que sostienen el cuerpo, protegen órganos y transmiten fuerzas","c) Unir los músculos entre sí","d) Producir líquido sinovial para las articulaciones"],
       ca:["a) Generar la força del moviment","b) Actuar com a palanques rígides que sostenen el cos, protegeixen òrgans i transmeten forces","c) Unir els músculs entre si","d) Produir líquid sinovial per a les articulacions"],
       en:["a) Generate movement force","b) Act as rigid levers that support the body, protect organs and transmit forces","c) Connect muscles to each other","d) Produce synovial fluid for joints"]},
 correct:1,
 expl:{es:"Los huesos son estructuras rígidas y dinámicas que sostienen el cuerpo, protegen órganos vitales y actúan como palancas para el movimiento (Pres II, Sección 1).",
       ca:"Els ossos són estructures rígides i dinàmiques que sostenen el cos, protegeixen òrgans vitals i actuen com a palanques per al moviment (Pres II, Secció 1).",
       en:"Bones are rigid and dynamic structures that support the body, protect vital organs and act as levers for movement (Pres II, Section 1)."}},

{block:3, tagColor:"#f7971e",
 tag:{es:"Biomecánica",ca:"Biomecànica",en:"Biomechanics"},
 ref:{es:"Presentación II · Sección 3",ca:"Presentació II · Secció 3",en:"Presentation II · Section 3"},
 q:{es:"Cuando un músculo se contrae, ¿qué ocurre realmente a nivel de sus proteínas?",
    ca:"Quan un múscul es contreu, què passa realment a nivell de les seves proteïnes?",
    en:"When a muscle contracts, what actually happens at the level of its proteins?"},
 opts:{es:["a) Las proteínas de actina y miosina se encogen individualmente","b) Las proteínas de actina y miosina se deslizan unas sobre otras, acercando las líneas Z","c) Las proteínas se disuelven y se regeneran","d) Las proteínas de colágeno se estiran"],
       ca:["a) Les proteïnes d'actina i miosina s'encongeixen individualment","b) Les proteïnes d'actina i miosina es llisquen unes sobre les altres, acostant les línies Z","c) Les proteïnes es dissolen i es regeneren","d) Les proteïnes de col·lagen s'estiren"],
       en:["a) Actin and myosin proteins shrink individually","b) Actin and myosin proteins slide over each other, bringing the Z lines closer","c) Proteins dissolve and regenerate","d) Collagen proteins stretch"]},
 correct:1,
 expl:{es:"El músculo no se «encoge» en su estructura proteica. Lo que ocurre es que los filamentos de actina y miosina se deslizan unos sobre otros, acercando las líneas Z y acortando el sarcómero (Pres II, Sección 3).",
       ca:"El múscul no s'«encongeix» en la seva estructura proteica. El que passa és que els filaments d'actina i miosina es llisquen uns sobre els altres, acostant les línies Z i escurçant el sarcòmer (Pres II, Secció 3).",
       en:"The muscle does not 'shrink' in its protein structure. What happens is that actin and myosin filaments slide over each other, bringing the Z lines closer and shortening the sarcomere (Pres II, Section 3)."}},

{block:3, tagColor:"#f7971e",
 tag:{es:"Biomecánica",ca:"Biomecànica",en:"Biomechanics"},
 ref:{es:"Presentación II · Sección 4",ca:"Presentació II · Secció 4",en:"Presentation II · Section 4"},
 q:{es:"En un <em>grand plié</em>, ¿qué tipo de contracción realizan los cuádriceps durante la fase de descenso?",
    ca:"En un <em>grand plié</em>, quin tipus de contracció fan els quàdriceps durant la fase de descens?",
    en:"In a <em>grand plié</em>, what type of contraction do the quadriceps perform during the descent phase?"},
 opts:{es:["a) Concéntrica, porque se acortan","b) Isométrica, porque no cambian de longitud","c) Excéntrica, porque generan tensión mientras se alargan para frenar el descenso","d) No realizan ninguna contracción"],
       ca:["a) Concèntrica, perquè s'escurcen","b) Isomètrica, perquè no canvien de longitud","c) Excèntrica, perquè generen tensió mentre s'allarguen per frenar el descens","d) No fan cap contracció"],
       en:["a) Concentric, because they shorten","b) Isometric, because they don't change length","c) Eccentric, because they generate tension while lengthening to brake the descent","d) They perform no contraction"]},
 correct:2,
 expl:{es:"Durante el descenso del plié, los cuádriceps se alargan pero generan tensión para controlar la velocidad de bajada (frenan la gravedad). Esto es una contracción excéntrica (Pres II, Sección 4).",
       ca:"Durant el descens del plié, els quàdriceps s'allarguen però generen tensió per controlar la velocitat de baixada (frenen la gravetat). Això és una contracció excèntrica (Pres II, Secció 4).",
       en:"During the descent of the plié, the quadriceps lengthen but generate tension to control the descent speed (braking gravity). This is an eccentric contraction (Pres II, Section 4)."}},

{block:3, tagColor:"#f7971e",
 tag:{es:"Biomecánica",ca:"Biomecànica",en:"Biomechanics"},
 ref:{es:"Presentación II · Sección 5",ca:"Presentació II · Secció 5",en:"Presentation II · Section 5"},
 q:{es:"¿Por qué se dice que «los músculos trabajan en equipo»?",
    ca:"Per què es diu que «els músculs treballen en equip»?",
    en:"Why is it said that 'muscles work as a team'?"},
 opts:{es:["a) Porque todos los músculos del cuerpo se contraen a la vez","b) Porque para cualquier movimiento se necesita la coordinación de agonistas, antagonistas y sinergistas","c) Porque los músculos comparten la misma motoneurona","d) Porque los músculos se comunican mediante hormonas"],
       ca:["a) Perquè tots els músculs del cos es contreuen alhora","b) Perquè per a qualsevol moviment es necessita la coordinació d'agonistes, antagonistes i sinergistes","c) Perquè els músculs comparteixen la mateixa motoneurona","d) Perquè els músculs es comuniquen mitjançant hormones"],
       en:["a) Because all body muscles contract at once","b) Because any movement requires the coordination of agonists, antagonists and synergists","c) Because muscles share the same motor neuron","d) Because muscles communicate through hormones"]},
 correct:1,
 expl:{es:"Ningún músculo trabaja aislado. Para cada movimiento, un grupo de músculos (agonistas) produce la acción, otros (antagonistas) la controlan, y otros (sinergistas) la estabilizan (Pres II, Sección 5).",
       ca:"Cap múscul treballa aïllat. Per a cada moviment, un grup de músculs (agonistes) produeix l'acció, altres (antagonistes) la controlen, i altres (sinergistes) l'estabilitzen (Pres II, Secció 5).",
       en:"No muscle works in isolation. For each movement, one group of muscles (agonists) produces the action, others (antagonists) control it, and others (synergists) stabilize it (Pres II, Section 5)."}},

// ─── BLOQUE 5 ───
{block:4, tagColor:"#6a11cb",
 tag:{es:"Sistema Óseo",ca:"Sistema Ossi",en:"Skeletal System"},
 ref:{es:"Presentación II · Sección 6",ca:"Presentació II · Secció 6",en:"Presentation II · Section 6"},
 q:{es:"¿Qué tipo de hueso es el fémur y cuál es su función principal en la danza?",
    ca:"Quin tipus d'os és el fèmur i quina és la seva funció principal en la dansa?",
    en:"What type of bone is the femur and what is its main function in dance?"},
 opts:{es:["a) Hueso corto; aporta estabilidad al pie","b) Hueso plano; protege los órganos internos","c) Hueso largo; actúa como palanca para el movimiento","d) Hueso sesamoideo; modifica la dirección de la fuerza"],
       ca:["a) Os curt; aporta estabilitat al peu","b) Os pla; protegeix els òrgans interns","c) Os llarg; actua com a palanca per al moviment","d) Os sesamoide; modifica la direcció de la força"],
       en:["a) Short bone; provides stability to the foot","b) Flat bone; protects internal organs","c) Long bone; acts as a lever for movement","d) Sesamoid bone; modifies force direction"]},
 correct:2,
 expl:{es:"El fémur es un hueso largo. Los huesos largos actúan como palancas y soportan el movimiento, lo que es esencial para saltos, extensiones y desplazamientos en danza (Pres II, Sección 6).",
       ca:"El fèmur és un os llarg. Els ossos llargs actuen com a palanques i suporten el moviment, cosa que és essencial per a salts, extensions i desplaçaments en dansa (Pres II, Secció 6).",
       en:"The femur is a long bone. Long bones act as levers and support movement, which is essential for jumps, extensions and displacements in dance (Pres II, Section 6)."}},

{block:4, tagColor:"#6a11cb",
 tag:{es:"Sistema Óseo",ca:"Sistema Ossi",en:"Skeletal System"},
 ref:{es:"Presentación II · Sección 6",ca:"Presentació II · Secció 6",en:"Presentation II · Section 6"},
 q:{es:"Los huesos del tarso (en el pie) y del carpo (en la mano) se clasifican como:",
    ca:"Els ossos del tars (al peu) i del carp (a la mà) es classifiquen com:",
    en:"The tarsal (foot) and carpal (hand) bones are classified as:"},
 opts:{es:["a) Huesos largos","b) Huesos cortos","c) Huesos planos","d) Huesos irregulares"],
       ca:["a) Ossos llargs","b) Ossos curts","c) Ossos plans","d) Ossos irregulars"],
       en:["a) Long bones","b) Short bones","c) Flat bones","d) Irregular bones"]},
 correct:1,
 expl:{es:"Los huesos cortos (carpo, tarso) tienen forma aproximadamente cúbica. Aportan estabilidad y permiten pequeños desplazamientos, esenciales para la articulación del pie en danza (Pres II, Sección 6).",
       ca:"Els ossos curts (carp, tars) tenen forma aproximadament cúbica. Aporten estabilitat i permeten petits desplaçaments, essencials per a l'articulació del peu en dansa (Pres II, Secció 6).",
       en:"Short bones (carpal, tarsal) have an approximately cubic shape. They provide stability and allow small displacements, essential for foot articulation in dance (Pres II, Section 6)."}},

{block:4, tagColor:"#6a11cb",
 tag:{es:"Sistema Óseo",ca:"Sistema Ossi",en:"Skeletal System"},
 ref:{es:"Presentación II · Sección 6",ca:"Presentació II · Secció 6",en:"Presentation II · Section 6"},
 q:{es:"¿Cuál es la función principal de los huesos planos como la escápula, el esternón o las costillas?",
    ca:"Quina és la funció principal dels ossos plans com l'escàpula, l'estèrnum o les costelles?",
    en:"What is the main function of flat bones such as the scapula, sternum or ribs?"},
 opts:{es:["a) Actuar como palancas para el movimiento","b) Proteger órganos y ofrecer amplia superficie de inserción muscular","c) Modificar la dirección de la fuerza muscular","d) Permitir pequeños desplazamientos"],
       ca:["a) Actuar com a palanques per al moviment","b) Protegir òrgans i oferir àmplia superfície d'inserció muscular","c) Modificar la direcció de la força muscular","d) Permetre petits desplaçaments"],
       en:["a) Act as levers for movement","b) Protect organs and offer a wide surface for muscle attachment","c) Modify the direction of muscle force","d) Allow small displacements"]},
 correct:1,
 expl:{es:"Los huesos planos protegen órganos vitales (cráneo → cerebro, costillas → pulmones/corazón) y ofrecen una amplia superficie para la inserción de músculos (Pres II, Sección 6).",
       ca:"Els ossos plans protegeixen òrgans vitals (crani → cervell, costelles → pulmons/cor) i ofereixen una àmplia superfície per a la inserció de músculs (Pres II, Secció 6).",
       en:"Flat bones protect vital organs (skull → brain, ribs → lungs/heart) and offer a wide surface for muscle attachment (Pres II, Section 6)."}},

{block:4, tagColor:"#6a11cb",
 tag:{es:"Sistema Óseo",ca:"Sistema Ossi",en:"Skeletal System"},
 ref:{es:"Presentación II · Sección 6",ca:"Presentació II · Secció 6",en:"Presentation II · Section 6"},
 q:{es:"La rótula es un hueso que se desarrolla dentro del tendón del cuádriceps. ¿Cómo se clasifica?",
    ca:"La ròtula és un os que es desenvolupa dins del tendó del quàdriceps. Com es classifica?",
    en:"The patella is a bone that develops within the quadriceps tendon. How is it classified?"},
 opts:{es:["a) Hueso largo","b) Hueso irregular","c) Hueso sesamoideo","d) Hueso plano"],
       ca:["a) Os llarg","b) Os irregular","c) Os sesamoide","d) Os pla"],
       en:["a) Long bone","b) Irregular bone","c) Sesamoid bone","d) Flat bone"]},
 correct:2,
 expl:{es:"Los huesos sesamoideos se desarrollan dentro de tendones para modificar la dirección o el brazo de palanca de la fuerza muscular. La rótula es el ejemplo más conocido (Pres II, Sección 6).",
       ca:"Els ossos sesamoides es desenvolupen dins de tendons per modificar la direcció o el braç de palanca de la força muscular. La ròtula és l'exemple més conegut (Pres II, Secció 6).",
       en:"Sesamoid bones develop within tendons to modify the direction or lever arm of muscle force. The patella is the best-known example (Pres II, Section 6)."}},

{block:4, tagColor:"#6a11cb",
 tag:{es:"Sistema Óseo",ca:"Sistema Ossi",en:"Skeletal System"},
 ref:{es:"Presentación II · Sección 7",ca:"Presentació II · Secció 7",en:"Presentation II · Section 7"},
 q:{es:"¿Qué parte del hueso largo corresponde a los extremos y está compuesta principalmente por hueso esponjoso?",
    ca:"Quina part de l'os llarg correspon als extrems i està composta principalment per os esponjós?",
    en:"Which part of the long bone corresponds to the ends and is mainly composed of spongy bone?"},
 opts:{es:["a) Diáfisis","b) Metáfisis","c) Epífisis","d) Periostio"],
       ca:["a) Diàfisi","b) Metàfisi","c) Epífisi","d) Periosti"],
       en:["a) Diaphysis","b) Metaphysis","c) Epiphysis","d) Periosteum"]},
 correct:2,
 expl:{es:"Las epífisis son los extremos del hueso largo, compuestas principalmente por hueso esponjoso. Participan en la formación de las articulaciones (Pres II, Sección 7).",
       ca:"Les epífisis són els extrems de l'os llarg, compostes principalment per os esponjós. Participen en la formació de les articulacions (Pres II, Secció 7).",
       en:"The epiphyses are the ends of the long bone, mainly composed of spongy bone. They participate in joint formation (Pres II, Section 7)."}},

{block:4, tagColor:"#6a11cb",
 tag:{es:"Sistema Óseo",ca:"Sistema Ossi",en:"Skeletal System"},
 ref:{es:"Presentación II · Sección 7",ca:"Presentació II · Secció 7",en:"Presentation II · Section 7"},
 q:{es:"¿Qué es la diáfisis de un hueso largo?",
    ca:"Què és la diàfisi d'un os llarg?",
    en:"What is the diaphysis of a long bone?"},
 opts:{es:["a) El extremo articular del hueso","b) La zona de transición con la placa de crecimiento","c) La parte central y alargada, formada por hueso compacto que rodea la cavidad medular","d) La capa externa de tejido conectivo"],
       ca:["a) L'extrem articular de l'os","b) La zona de transició amb la placa de creixement","c) La part central i allargada, formada per os compacte que envolta la cavitat medul·lar","d) La capa externa de teixit connectiu"],
       en:["a) The articular end of the bone","b) The transition zone with the growth plate","c) The central elongated part, made of compact bone surrounding the medullary cavity","d) The outer layer of connective tissue"]},
 correct:2,
 expl:{es:"La diáfisis es la parte central (caña) del hueso largo, formada por hueso compacto que rodea la cavidad medular. Es la zona que soporta las mayores cargas mecánicas (Pres II, Sección 7).",
       ca:"La diàfisi és la part central (canya) de l'os llarg, formada per os compacte que envolta la cavitat medul·lar. És la zona que suporta les majors càrregues mecàniques (Pres II, Secció 7).",
       en:"The diaphysis is the central part (shaft) of the long bone, made of compact bone surrounding the medullary cavity. It is the area that supports the greatest mechanical loads (Pres II, Section 7)."}},

{block:4, tagColor:"#6a11cb",
 tag:{es:"Sistema Óseo",ca:"Sistema Ossi",en:"Skeletal System"},
 ref:{es:"Presentación II · Sección 7",ca:"Presentació II · Secció 7",en:"Presentation II · Section 7"},
 q:{es:"Una bailarina adolescente de 14 años aún está creciendo. ¿En qué zona de sus huesos largos se encuentra la placa de crecimiento activa?",
    ca:"Una ballarina adolescent de 14 anys encara està creixent. En quina zona dels seus ossos llargs es troba la placa de creixement activa?",
    en:"A 14-year-old teenage dancer is still growing. In which area of her long bones is the active growth plate located?"},
 opts:{es:["a) En la epífisis","b) En la diáfisis","c) En la metáfisis","d) En la cavidad medular"],
       ca:["a) A l'epífisi","b) A la diàfisi","c) A la metàfisi","d) A la cavitat medul·lar"],
       en:["a) In the epiphysis","b) In the diaphysis","c) In the metaphysis","d) In the medullary cavity"]},
 correct:2,
 expl:{es:"La metáfisis es la zona de transición entre la epífisis y la diáfisis que contiene la placa de crecimiento (cartílago de crecimiento) durante la etapa de desarrollo (Pres II, Sección 7).",
       ca:"La metàfisi és la zona de transició entre l'epífisi i la diàfisi que conté la placa de creixement (cartílag de creixement) durant l'etapa de desenvolupament (Pres II, Secció 7).",
       en:"The metaphysis is the transition zone between the epiphysis and diaphysis that contains the growth plate (growth cartilage) during development (Pres II, Section 7)."}},

{block:4, tagColor:"#6a11cb",
 tag:{es:"Sistema Óseo",ca:"Sistema Ossi",en:"Skeletal System"},
 ref:{es:"Presentación II · Sección 8",ca:"Presentació II · Secció 8",en:"Presentation II · Section 8"},
 q:{es:"¿Cuál es la diferencia entre la médula ósea roja y la amarilla?",
    ca:"Quina és la diferència entre la medul·la òssia vermella i la groga?",
    en:"What is the difference between red and yellow bone marrow?"},
 opts:{es:["a) La roja produce células sanguíneas; la amarilla es tejido adiposo (grasa)","b) La roja es grasa; la amarilla produce células sanguíneas","c) No hay diferencia; ambas producen sangre","d) La roja está en la diáfisis; la amarilla en la epífisis"],
       ca:["a) La vermella produeix cèl·lules sanguínies; la groga és teixit adipós (greix)","b) La vermella és greix; la groga produeix cèl·lules sanguínies","c) No hi ha diferència; totes dues produeixen sang","d) La vermella està a la diàfisi; la groga a l'epífisi"],
       en:["a) Red produces blood cells; yellow is adipose tissue (fat)","b) Red is fat; yellow produces blood cells","c) There is no difference; both produce blood","d) Red is in the diaphysis; yellow in the epiphysis"]},
 correct:0,
 expl:{es:"La médula ósea roja produce células sanguíneas (hematopoyesis). La médula ósea amarilla es tejido adiposo de reserva energética. Ambas se encuentran en la cavidad medular (Pres II, Sección 8).",
       ca:"La medul·la òssia vermella produeix cèl·lules sanguínies (hematopoesi). La medul·la òssia groga és teixit adipós de reserva energètica. Totes dues es troben a la cavitat medul·lar (Pres II, Secció 8).",
       en:"Red bone marrow produces blood cells (hematopoiesis). Yellow bone marrow is adipose tissue for energy reserve. Both are found in the medullary cavity (Pres II, Section 8)."}},

{block:4, tagColor:"#6a11cb",
 tag:{es:"Sistema Óseo",ca:"Sistema Ossi",en:"Skeletal System"},
 ref:{es:"Presentación II · Sección 11",ca:"Presentació II · Secció 11",en:"Presentation II · Section 11"},
 q:{es:"Una bailarina que entrena <em>pointe work</em> diariamente durante años desarrolla huesos del pie más densos y resistentes. ¿Qué proceso fisiológico explica esto?",
    ca:"Una ballarina que entrena <em>pointe work</em> diàriament durant anys desenvolupa ossos del peu més densos i resistents. Quin procés fisiològic explica això?",
    en:"A dancer who trains <em>pointe work</em> daily for years develops denser and stronger foot bones. What physiological process explains this?"},
 opts:{es:["a) El hueso es un tejido estático que no cambia","b) La remodelación ósea: el hueso se adapta y refuerza según la carga mecánica recibida","c) Los huesos del pie se fusionan con los del tobillo","d) El cartílago se convierte en músculo"],
       ca:["a) L'os és un teixit estàtic que no canvia","b) La remodelació òssia: l'os s'adapta i reforça segons la càrrega mecànica rebuda","c) Els ossos del peu es fusionen amb els del turmell","d) El cartílag es converteix en múscul"],
       en:["a) Bone is a static tissue that doesn't change","b) Bone remodeling: bone adapts and strengthens according to the mechanical load received","c) Foot bones fuse with ankle bones","d) Cartilage turns into muscle"]},
 correct:1,
 expl:{es:"El hueso es un tejido dinámico que se adapta y remodela continuamente según la magnitud y frecuencia de la carga mecánica (Ley de Wolff). Más carga = más densidad ósea (Pres II, Sección 11).",
       ca:"L'os és un teixit dinàmic que s'adapta i remodela contínuament segons la magnitud i freqüència de la càrrega mecànica (Llei de Wolff). Més càrrega = més densitat òssia (Pres II, Secció 11).",
       en:"Bone is a dynamic tissue that continuously adapts and remodels according to the magnitude and frequency of mechanical load (Wolff's Law). More load = more bone density (Pres II, Section 11)."}},

{block:4, tagColor:"#6a11cb",
 tag:{es:"Sistema Óseo",ca:"Sistema Ossi",en:"Skeletal System"},
 ref:{es:"Presentación II · Sección 9",ca:"Presentació II · Secció 9",en:"Presentation II · Section 9"},
 q:{es:"¿Cuál de las siguientes NO es una función del sistema esquelético?",
    ca:"Quina de les següents NO és una funció del sistema esquelètic?",
    en:"Which of the following is NOT a function of the skeletal system?"},
 opts:{es:["a) Soporte mecánico del cuerpo","b) Protección de órganos vitales","c) Producción de hormonas del crecimiento","d) Reservorio de minerales (calcio, fósforo)"],
       ca:["a) Suport mecànic del cos","b) Protecció d'òrgans vitals","c) Producció d'hormones del creixement","d) Reservori de minerals (calci, fòsfor)"],
       en:["a) Mechanical support of the body","b) Protection of vital organs","c) Production of growth hormones","d) Mineral reservoir (calcium, phosphorus)"]},
 correct:2,
 expl:{es:"Las funciones del esqueleto son: soporte, protección, reservorio mineral y facilitación del movimiento. La producción de hormonas del crecimiento corresponde al sistema endocrino (hipófisis), no al esqueleto (Pres II, Sección 9).",
       ca:"Les funcions de l'esquelet són: suport, protecció, reservori mineral i facilitació del moviment. La producció d'hormones del creixement correspon al sistema endocrí (hipòfisi), no a l'esquelet (Pres II, Secció 9).",
       en:"The functions of the skeleton are: support, protection, mineral reservoir and facilitating movement. Growth hormone production corresponds to the endocrine system (pituitary), not the skeleton (Pres II, Section 9)."}},

// ─── BLOQUE 6 ───
{block:5, tagColor:"#fc4a1a",
 tag:{es:"Articulaciones",ca:"Articulacions",en:"Joints"},
 ref:{es:"Presentación II · Sección 12",ca:"Presentació II · Secció 12",en:"Presentation II · Section 12"},
 q:{es:"¿Cuáles son los tres tipos principales de articulaciones según su grado de movilidad?",
    ca:"Quins són els tres tipus principals d'articulacions segons el seu grau de mobilitat?",
    en:"What are the three main types of joints according to their degree of mobility?"},
 opts:{es:["a) Rígidas, semirrígidas y elásticas","b) Fibrosas, cartilaginosas y sinoviales","c) Largas, cortas y planas","d) Simples, compuestas y complejas"],
       ca:["a) Rígides, semirígides i elàstiques","b) Fibroses, cartilaginoses i sinovials","c) Llargues, curtes i planes","d) Simples, compostes i complexes"],
       en:["a) Rigid, semi-rigid and elastic","b) Fibrous, cartilaginous and synovial","c) Long, short and flat","d) Simple, compound and complex"]},
 correct:1,
 expl:{es:"Las articulaciones se clasifican en: fibrosas (poca o nula movilidad), cartilaginosas (movilidad limitada) y sinoviales (gran movilidad, como la rodilla o la cadera) (Pres II, Sección 12).",
       ca:"Les articulacions es classifiquen en: fibroses (poca o nul·la mobilitat), cartilaginoses (mobilitat limitada) i sinovials (gran mobilitat, com el genoll o el maluc) (Pres II, Secció 12).",
       en:"Joints are classified as: fibrous (little or no mobility), cartilaginous (limited mobility) and synovial (great mobility, such as the knee or hip) (Pres II, Section 12)."}},

{block:5, tagColor:"#fc4a1a",
 tag:{es:"Articulaciones",ca:"Articulacions",en:"Joints"},
 ref:{es:"Presentación II · Sección 12",ca:"Presentació II · Secció 12",en:"Presentation II · Section 12"},
 q:{es:"La articulación de la cadera, que permite al bailarín hacer <em>grand battement</em> en todas las direcciones, es de tipo:",
    ca:"L'articulació del maluc, que permet al ballarí fer <em>grand battement</em> en totes les direccions, és de tipus:",
    en:"The hip joint, which allows the dancer to perform <em>grand battement</em> in all directions, is of type:"},
 opts:{es:["a) Fibrosa (inmóvil)","b) Cartilaginosa (semimóvil)","c) Sinovial (móvil)","d) Sesamoidea"],
       ca:["a) Fibrosa (immòbil)","b) Cartilaginosa (semimòbil)","c) Sinovial (mòbil)","d) Sesamoide"],
       en:["a) Fibrous (immobile)","b) Cartilaginous (semi-mobile)","c) Synovial (mobile)","d) Sesamoid"]},
 correct:2,
 expl:{es:"La cadera es una articulación sinovial de tipo enartrosis (bola y cavidad), lo que le permite un amplio rango de movimiento en todos los planos, esencial para la danza (Pres II, Sección 12).",
       ca:"El maluc és una articulació sinovial de tipus enartrosi (bola i cavitat), cosa que li permet un ampli rang de moviment en tots els plans, essencial per a la dansa (Pres II, Secció 12).",
       en:"The hip is a synovial joint of the ball-and-socket type, which allows a wide range of movement in all planes, essential for dance (Pres II, Section 12)."}},

{block:5, tagColor:"#fc4a1a",
 tag:{es:"Articulaciones",ca:"Articulacions",en:"Joints"},
 ref:{es:"Presentación II · Sección 13",ca:"Presentació II · Secció 13",en:"Presentation II · Section 13"},
 q:{es:"¿Qué estructura articular actúa como amortiguador entre los huesos y reduce la fricción durante el movimiento?",
    ca:"Quina estructura articular actua com a esmorteïdor entre els ossos i redueix la fricció durant el moviment?",
    en:"Which joint structure acts as a cushion between bones and reduces friction during movement?"},
 opts:{es:["a) El ligamento","b) El tendón","c) El cartílago articular","d) La cápsula articular"],
       ca:["a) El lligament","b) El tendó","c) El cartílag articular","d) La càpsula articular"],
       en:["a) The ligament","b) The tendon","c) The articular cartilage","d) The joint capsule"]},
 correct:2,
 expl:{es:"El cartílago articular recubre los extremos óseos dentro de la articulación, actuando como amortiguador y reduciendo la fricción entre las superficies óseas durante el movimiento (Pres II, Sección 13).",
       ca:"El cartílag articular recobreix els extrems ossis dins de l'articulació, actuant com a esmorteïdor i reduint la fricció entre les superfícies òssies durant el moviment (Pres II, Secció 13).",
       en:"Articular cartilage covers the bone ends within the joint, acting as a cushion and reducing friction between bone surfaces during movement (Pres II, Section 13)."}},

{block:5, tagColor:"#fc4a1a",
 tag:{es:"Articulaciones",ca:"Articulacions",en:"Joints"},
 ref:{es:"Presentación II · Sección 13",ca:"Presentació II · Secció 13",en:"Presentation II · Section 13"},
 q:{es:"¿Qué función cumple el líquido sinovial dentro de una articulación?",
    ca:"Quina funció fa el líquid sinovial dins d'una articulació?",
    en:"What function does synovial fluid serve within a joint?"},
 opts:{es:["a) Unir los huesos entre sí","b) Nutrir el cartílago y lubricar la articulación para reducir la fricción","c) Generar la contracción muscular","d) Producir células sanguíneas"],
       ca:["a) Unir els ossos entre si","b) Nodrir el cartílag i lubricar l'articulació per reduir la fricció","c) Generar la contracció muscular","d) Produir cèl·lules sanguínies"],
       en:["a) Connect bones to each other","b) Nourish cartilage and lubricate the joint to reduce friction","c) Generate muscle contraction","d) Produce blood cells"]},
 correct:1,
 expl:{es:"El líquido sinovial, contenido dentro de la cápsula articular, lubrica las superficies articulares y nutre el cartílago articular (que carece de vasos sanguíneos) (Pres II, Sección 13).",
       ca:"El líquid sinovial, contingut dins de la càpsula articular, lubrica les superfícies articulars i nodreix el cartílag articular (que manca de vasos sanguinis) (Pres II, Secció 13).",
       en:"Synovial fluid, contained within the joint capsule, lubricates the articular surfaces and nourishes the articular cartilage (which lacks blood vessels) (Pres II, Section 13)."}},

{block:5, tagColor:"#fc4a1a",
 tag:{es:"Articulaciones",ca:"Articulacions",en:"Joints"},
 ref:{es:"Presentación II · Sección 14",ca:"Presentació II · Secció 14",en:"Presentation II · Section 14"},
 q:{es:"El cartílago articular no tiene vasos sanguíneos. ¿Cómo obtiene sus nutrientes?",
    ca:"El cartílag articular no té vasos sanguinis. Com obté els seus nutrients?",
    en:"Articular cartilage has no blood vessels. How does it obtain its nutrients?"},
 opts:{es:["a) A través de los nervios que lo rodean","b) Mediante la alternancia de carga (compresión que expulsa agua) y descarga (reabsorción de líquido sinovial)","c) No necesita nutrientes porque es un tejido muerto","d) A través de los tendones que se insertan en él"],
       ca:["a) A través dels nervis que el rodegen","b) Mitjançant l'alternança de càrrega (compressió que expulsa aigua) i descàrrega (reabsorció de líquid sinovial)","c) No necessita nutrients perquè és un teixit mort","d) A través dels tendons que s'hi inserten"],
       en:["a) Through the nerves surrounding it","b) Through alternating load (compression expelling water) and unload (reabsorption of synovial fluid)","c) It doesn't need nutrients because it's dead tissue","d) Through the tendons inserted into it"]},
 correct:1,
 expl:{es:"Al ser avascular, el cartílago se nutre por un mecanismo de «esponja»: la compresión expulsa agua y solutos, y la descarga permite la reabsorción de líquido sinovial rico en nutrientes (Pres II, Sección 14).",
       ca:"En ser avascular, el cartílag es nodreix per un mecanisme d'«esponja»: la compressió expulsa aigua i soluts, i la descàrrega permet la reabsorció de líquid sinovial ric en nutrients (Pres II, Secció 14).",
       en:"Being avascular, cartilage is nourished by a 'sponge' mechanism: compression expels water and solutes, and unloading allows reabsorption of nutrient-rich synovial fluid (Pres II, Section 14)."}},

{block:5, tagColor:"#fc4a1a",
 tag:{es:"Articulaciones",ca:"Articulacions",en:"Joints"},
 ref:{es:"Presentación II · Sección 14",ca:"Presentació II · Secció 14",en:"Presentation II · Section 14"},
 q:{es:"¿Por qué es importante que un bailarín no permanezca inmóvil durante muchas horas y alterne períodos de actividad con reposo?",
    ca:"Per què és important que un ballarí no romangui immòbil durant moltes hores i alterni períodes d'activitat amb repòs?",
    en:"Why is it important for a dancer not to remain immobile for many hours and to alternate periods of activity with rest?"},
 opts:{es:["a) Porque los huesos se ablandan si no se mueven","b) Porque el cartílago necesita la alternancia carga-descarga para nutrirse; sin movimiento, se degenera","c) Porque los ligamentos se acortan permanentemente","d) Porque el líquido sinovial se evapora"],
       ca:["a) Perquè els ossos s'estoven si no es mouen","b) Perquè el cartílag necessita l'alternança càrrega-descàrrega per nodrir-se; sense moviment, es degenera","c) Perquè els lligaments s'escurcen permanentment","d) Perquè el líquid sinovial s'evapora"],
       en:["a) Because bones soften if not moved","b) Because cartilage needs load-unload alternation to be nourished; without movement, it degenerates","c) Because ligaments permanently shorten","d) Because synovial fluid evaporates"]},
 correct:1,
 expl:{es:"El cartílago articular necesita movimiento y carga para nutrirse. La inmovilidad prolongada impide el mecanismo de compresión-reabsorción, lo que puede llevar a la degeneración del cartílago (Pres II, Sección 14).",
       ca:"El cartílag articular necessita moviment i càrrega per nodrir-se. La immobilitat prolongada impedeix el mecanisme de compressió-reabsorció, cosa que pot portar a la degeneració del cartílag (Pres II, Secció 14).",
       en:"Articular cartilage needs movement and load to be nourished. Prolonged immobility prevents the compression-reabsorption mechanism, which can lead to cartilage degeneration (Pres II, Section 14)."}},

{block:5, tagColor:"#fc4a1a",
 tag:{es:"Articulaciones",ca:"Articulacions",en:"Joints"},
 ref:{es:"Presentación II · Sección 13",ca:"Presentació II · Secció 13",en:"Presentation II · Section 13"},
 q:{es:"¿Qué estructura envuelve la articulación sinovial y mantiene el líquido sinovial en su interior?",
    ca:"Quina estructura embolcalla l'articulació sinovial i manté el líquid sinovial al seu interior?",
    en:"What structure surrounds the synovial joint and keeps the synovial fluid inside?"},
 opts:{es:["a) El periostio","b) La cápsula articular","c) El tendón","d) La fascia muscular"],
       ca:["a) El periosti","b) La càpsula articular","c) El tendó","d) La fàscia muscular"],
       en:["a) The periosteum","b) The joint capsule","c) The tendon","d) The muscle fascia"]},
 correct:1,
 expl:{es:"La cápsula articular es una envoltura de tejido conectivo que rodea la articulación sinovial, sellando el espacio articular y conteniendo el líquido sinovial (Pres II, Sección 13).",
       ca:"La càpsula articular és una envoltura de teixit connectiu que envolta l'articulació sinovial, segellant l'espai articular i contenint el líquid sinovial (Pres II, Secció 13).",
       en:"The joint capsule is a connective tissue envelope that surrounds the synovial joint, sealing the joint space and containing the synovial fluid (Pres II, Section 13)."}},

{block:5, tagColor:"#fc4a1a",
 tag:{es:"Articulaciones",ca:"Articulacions",en:"Joints"},
 ref:{es:"Presentación II · Sección 12",ca:"Presentació II · Secció 12",en:"Presentation II · Section 12"},
 q:{es:"Las suturas del cráneo son articulaciones que no permiten movimiento. ¿De qué tipo son?",
    ca:"Les sutures del crani són articulacions que no permeten moviment. De quin tipus són?",
    en:"The sutures of the skull are joints that do not allow movement. What type are they?"},
 opts:{es:["a) Sinoviales","b) Cartilaginosas","c) Fibrosas","d) Sesamoideas"],
       ca:["a) Sinovials","b) Cartilaginoses","c) Fibroses","d) Sesamoides"],
       en:["a) Synovial","b) Cartilaginous","c) Fibrous","d) Sesamoid"]},
 correct:2,
 expl:{es:"Las suturas del cráneo son articulaciones fibrosas: los huesos están unidos por tejido fibroso denso y no permiten movimiento (o muy poco). Su función es proteger el cerebro (Pres II, Sección 12).",
       ca:"Les sutures del crani són articulacions fibroses: els ossos estan units per teixit fibrós dens i no permeten moviment (o molt poc). La seva funció és protegir el cervell (Pres II, Secció 12).",
       en:"Skull sutures are fibrous joints: bones are joined by dense fibrous tissue and do not allow movement (or very little). Their function is to protect the brain (Pres II, Section 12)."}},

{block:5, tagColor:"#fc4a1a",
 tag:{es:"Articulaciones",ca:"Articulacions",en:"Joints"},
 ref:{es:"Presentación II · Sección 13",ca:"Presentació II · Secció 13",en:"Presentation II · Section 13"},
 q:{es:"¿Qué papel desempeñan los ligamentos en una articulación?",
    ca:"Quin paper fan els lligaments en una articulació?",
    en:"What role do ligaments play in a joint?"},
 opts:{es:["a) Generar la fuerza del movimiento","b) Producir líquido sinovial","c) Unir hueso con hueso, estabilizando y limitando el movimiento articular","d) Nutrir el cartílago articular"],
       ca:["a) Generar la força del moviment","b) Produir líquid sinovial","c) Unir os amb os, estabilitzant i limitant el moviment articular","d) Nodrir el cartílag articular"],
       en:["a) Generate movement force","b) Produce synovial fluid","c) Connect bone to bone, stabilizing and limiting joint movement","d) Nourish articular cartilage"]},
 correct:2,
 expl:{es:"Los ligamentos son bandas de tejido conectivo que unen un hueso con otro, contribuyendo a la estabilidad articular y limitando los movimientos excesivos que podrían causar lesión (Pres II, Secciones 1 y 13).",
       ca:"Els lligaments són bandes de teixit connectiu que uneixen un os amb un altre, contribuint a l'estabilitat articular i limitant els moviments excessius que podrien causar lesió (Pres II, Seccions 1 i 13).",
       en:"Ligaments are bands of connective tissue that connect one bone to another, contributing to joint stability and limiting excessive movements that could cause injury (Pres II, Sections 1 and 13)."}},

{block:5, tagColor:"#fc4a1a",
 tag:{es:"Articulaciones",ca:"Articulacions",en:"Joints"},
 ref:{es:"Presentación II · Sección 14",ca:"Presentació II · Secció 14",en:"Presentation II · Section 14"},
 q:{es:"Un bailarín que siempre entrena sobre superficies muy duras y nunca varía la carga sobre sus rodillas tiene mayor riesgo de desgaste del cartílago. ¿Por qué?",
    ca:"Un ballarí que sempre entrena sobre superfícies molt dures i mai varia la càrrega sobre els seus genolls té més risc de desgast del cartílag. Per què?",
    en:"A dancer who always trains on very hard surfaces and never varies the load on his knees has a higher risk of cartilage wear. Why?"},
 opts:{es:["a) Porque el cartílago se endurece con la carga","b) Porque la carga excesiva y repetitiva sin descarga adecuada impide la nutrición del cartílago y acelera su degeneración","c) Porque los huesos se rompen antes que el cartílago","d) Porque el líquido sinovial se congela"],
       ca:["a) Perquè el cartílag s'endureix amb la càrrega","b) Perquè la càrrega excessiva i repetitiva sense descàrrega adequada impedeix la nutrició del cartílag i accelera la seva degeneració","c) Perquè els ossos es trenquen abans que el cartílag","d) Perquè el líquid sinovial es congela"],
       en:["a) Because cartilage hardens with load","b) Because excessive and repetitive load without adequate unloading prevents cartilage nutrition and accelerates its degeneration","c) Because bones break before cartilage","d) Because synovial fluid freezes"]},
 correct:1,
 expl:{es:"El cartílago necesita alternancia de carga y descarga. La sobrecarga crónica sin períodos de recuperación comprime el cartílago de forma continua, impidiendo la reabsorción de nutrientes y acelerando el desgaste (Pres II, Sección 14).",
       ca:"El cartílag necessita alternança de càrrega i descàrrega. La sobrecàrrega crònica sense períodes de recuperació comprimeix el cartílag de forma contínua, impedint la reabsorció de nutrients i accelerant el desgast (Pres II, Secció 14).",
       en:"Cartilage needs alternating load and unload. Chronic overload without recovery periods continuously compresses the cartilage, preventing nutrient reabsorption and accelerating wear (Pres II, Section 14)."}},

// ─── BLOQUE 7 ───

// ===================== LANGUAGE MANAGEMENT =====================
let currentLang = 'es';

function setLanguage(lang){
  currentLang = lang;
  document.documentElement.lang = lang;
  document.querySelectorAll('.lang-selector button').forEach(b=>b.classList.toggle('active', b.dataset.lang===lang));
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.dataset.i18n;
    if(translations[lang] && translations[lang][key]) el.innerHTML = translations[lang][key];
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{
    const key = el.dataset.i18nPlaceholder;
    if(translations[lang] && translations[lang][key]) el.placeholder = translations[lang][key];
  });
  // Rebuild dynamic content
  if(document.getElementById('blocksContainer').children.length > 0){
    buildBlocks();
    document.getElementById(`block${currentBlock}`).classList.add('active');
    updateNav();
    // Restore answered states
    restoreAnsweredStates();
    if(document.getElementById('sendSection').style.display === 'block') showResults();
  }
  localStorage.setItem('testLanguage', lang);
}

function t(key, replacements){
  let text = (translations[currentLang] && translations[currentLang][key]) || (translations.es && translations.es[key]) || key;
  if(replacements){
    for(const [k,v] of Object.entries(replacements)){
      text = text.replace(new RegExp('\\{'+k+'\\}','g'), v);
    }
  }
  return text;
}

function getBlockName(bi){ return BLOCK_NAMES[bi].name[currentLang]; }
function getBlockRef(bi){ return BLOCK_NAMES[bi].ref[currentLang]; }
function getCaseQ(c){ return c.q[currentLang]; }
function getCaseOpts(c){ return c.opts[currentLang]; }
function getCaseExpl(c){ return c.expl[currentLang]; }
function getCaseTag(c){ return c.tag[currentLang]; }
function getCaseRef(c){ return c.ref[currentLang]; }

// ===================== APP LOGIC =====================
let currentBlock = 0;
let answered = {};

function buildBlocks(){
  const c = document.getElementById('blocksContainer');
  let html = '';
  BLOCK_NAMES.forEach((b,bi) => {
    const cases = DATA.filter(d => d.block === bi);
    html += `<div class="block" id="block${bi}">
      <div class="block-header ${b.cls}">${bi+1}. ${getBlockName(bi)}<small>${t('blockSubtitle',{ref:getBlockRef(bi)})}</small></div>
      <div class="block-body">`;
    cases.forEach((cs,ci) => {
      const gid = `b${bi}c${ci}`;
      const opts = getCaseOpts(cs);
      html += `<div class="caso" id="caso_${gid}">
        <span class="caso-tag" style="background:${cs.tagColor}">${getCaseTag(cs)}</span>
        <span style="font-size:.75em;color:#888;margin-left:8px">📖 ${getCaseRef(cs)}</span>
        <h4>${t('casoLabel',{n:ci+1})}: ${getCaseQ(cs)}</h4>
        <div class="opts" id="opts_${gid}">`;
      opts.forEach((o,oi) => {
        html += `<label id="lbl_${gid}_${oi}"><input type="radio" name="r_${gid}" value="${oi}" onchange="selectOpt('${gid}',${oi})"> ${o}</label>`;
      });
      html += `</div>
        <textarea class="explicacion-user" id="exp_${gid}" placeholder="${t('reasonPlaceholder')}"></textarea>
        <button class="btn-val" id="btn_${gid}" onclick="validate('${gid}',${bi},${ci})" disabled>${t('validateBtn')}</button>
        <div class="feedback" id="fb_${gid}"></div>
      </div>`;
    });
    html += `</div></div>`;
  });
  c.innerHTML = html;
}

function restoreAnsweredStates(){
  for(const [gid, a] of Object.entries(answered)){
    const labels = document.querySelectorAll(`#opts_${gid} label`);
    labels.forEach((l,i) => {
      l.style.pointerEvents = 'none';
      if(i === a.correct) l.classList.add('correct');
      if(i === a.sel && a.sel !== a.correct) l.classList.add('wrong');
    });
    const fb = document.getElementById(`fb_${gid}`);
    if(fb){
      const cs = findCase(gid);
      if(cs){
        if(a.ok){ fb.className = 'feedback ok'; fb.innerHTML = `${t('correctMsg')}<br>${getCaseExpl(cs)}`; }
        else { fb.className = 'feedback bad'; fb.innerHTML = `${t('incorrectMsg',{letter:getCaseOpts(cs)[a.correct].charAt(0)})}<br>${getCaseExpl(cs)}`; }
      }
    }
    const btn = document.getElementById(`btn_${gid}`);
    if(btn){ btn.disabled = true; btn.textContent = t('validatedBtn'); }
    const exp = document.getElementById(`exp_${gid}`);
    if(exp){ exp.value = a.exp || ''; exp.disabled = true; }
    const sel = document.querySelector(`input[name="r_${gid}"][value="${a.sel}"]`);
    if(sel){ sel.checked = true; const lbl = document.getElementById(`lbl_${gid}_${a.sel}`); if(lbl) lbl.classList.add('sel'); }
  }
}

function findCase(gid){
  const m = gid.match(/^b(\d+)c(\d+)$/);
  if(!m) return null;
  const bi = parseInt(m[1]), ci = parseInt(m[2]);
  const cases = DATA.filter(d => d.block === bi);
  return cases[ci];
}

function selectOpt(gid, oi){
  document.getElementById(`btn_${gid}`).disabled = false;
  const labels = document.querySelectorAll(`#opts_${gid} label`);
  labels.forEach(l => l.classList.remove('sel'));
  document.getElementById(`lbl_${gid}_${oi}`).classList.add('sel');
}

function validate(gid, bi, ci){
  if(answered[gid]) return;
  const cs = findCase(gid);
  const sel = document.querySelector(`input[name="r_${gid}"]:checked`);
  if(!sel) return;
  const val = parseInt(sel.value);
  const correct = cs.correct;
  answered[gid] = {sel: val, correct: correct, ok: val===correct, exp: document.getElementById(`exp_${gid}`).value};

  const labels = document.querySelectorAll(`#opts_${gid} label`);
  labels.forEach((l,i) => {
    l.style.pointerEvents = 'none';
    if(i === correct) l.classList.add('correct');
    if(i === val && val !== correct) l.classList.add('wrong');
  });

  const fb = document.getElementById(`fb_${gid}`);
  if(val === correct){
    fb.className = 'feedback ok';
    fb.innerHTML = `${t('correctMsg')}<br>${getCaseExpl(cs)}`;
  } else {
    fb.className = 'feedback bad';
    fb.innerHTML = `${t('incorrectMsg',{letter:getCaseOpts(cs)[correct].charAt(0)})}<br>${getCaseExpl(cs)}`;
  }

  document.getElementById(`btn_${gid}`).disabled = true;
  document.getElementById(`btn_${gid}`).textContent = t('validatedBtn');
  document.getElementById(`exp_${gid}`).disabled = true;

  checkFinish();
}

function checkFinish(){
  const total = DATA.length;
  const done = Object.keys(answered).length;
  if(done === total){
    document.getElementById('endTime').disabled = false;
    document.getElementById('endTime').value = new Date().toTimeString().slice(0,5);
    showResults();
  }
}

function showResults(){
  const total = DATA.length;
  const ok = Object.values(answered).filter(a=>a.ok).length;
  const pct = Math.round(ok/total*100);
  document.getElementById('scoreDisplay').textContent = `${ok} / ${total} (${pct}%)`;
  let detail = '';
  BLOCK_NAMES.forEach((b,bi) => {
    const cases = DATA.filter(d=>d.block===bi);
    const bok = cases.filter((_,ci)=> answered[`b${bi}c${ci}`] && answered[`b${bi}c${ci}`].ok).length;
    detail += `${getBlockName(bi)}: ${bok}/10 · `;
  });
  document.getElementById('scoreDetail').textContent = detail;
  document.getElementById('sendSection').style.display = 'block';
  document.getElementById('sendSection').scrollIntoView({behavior:'smooth'});
}

function navBlock(dir){
  document.getElementById(`block${currentBlock}`).classList.remove('active');
  currentBlock += dir;
  if(currentBlock < 0) currentBlock = 0;
  if(currentBlock >= BLOCK_NAMES.length) currentBlock = BLOCK_NAMES.length - 1;
  document.getElementById(`block${currentBlock}`).classList.add('active');
  updateNav();
  window.scrollTo({top: document.getElementById(`block${currentBlock}`).offsetTop - 20, behavior:'smooth'});
}

function updateNav(){
  document.getElementById('btnPrev').disabled = currentBlock === 0;
  document.getElementById('btnNext').disabled = currentBlock === BLOCK_NAMES.length - 1;
  document.getElementById('progressText').textContent = t('progressBlock',{n:currentBlock+1, total:BLOCK_NAMES.length});
}

function startTest(){
  const name = document.getElementById('stuName').value.trim();
  const email = document.getElementById('stuEmail').value.trim();
  if(!name || !email){
    alert(t('alertFillNameEmail'));
    return;
  }
  document.getElementById('startTime').value = new Date().toTimeString().slice(0,5);
  document.getElementById('stuDate').value = new Date().toISOString().slice(0,10);
  document.getElementById('personalForm').style.display = 'none';
  document.getElementById('navBar').style.display = 'flex';
  buildBlocks();
  document.getElementById(`block0`).classList.add('active');
  updateNav();
}

function sendEmail(){
  const name = document.getElementById('stuName').value;
  const email = document.getElementById('stuEmail').value;
  const prof = document.getElementById('profEmail').value || 'professora@escuela.com';
  const date = document.getElementById('stuDate').value;
  const start = document.getElementById('startTime').value;
  const end = document.getElementById('endTime').value;
  const total = DATA.length;
  const ok = Object.values(answered).filter(a=>a.ok).length;
  const pct = Math.round(ok/total*100);

  let body = `${t('emailHeader')}%0D%0A`;
  body += `${t('emailCourse')}%0D%0A%0D%0A`;
  body += `${t('emailStudent')}: ${name}%0D%0A`;
  body += `${t('emailEmail')}: ${email}%0D%0A`;
  body += `${t('emailDate')}: ${date}%0D%0A`;
  body += `${t('emailStart')}: ${start}%0D%0A`;
  body += `${t('emailEnd')}: ${end}%0D%0A%0D%0A`;
  body += `${t('emailResult')}: ${ok}/${total} (${pct}%)%0D%0A%0D%0A`;

  BLOCK_NAMES.forEach((b,bi) => {
    body += `--- ${getBlockName(bi)} ---%0D%0A`;
    const cases = DATA.filter(d=>d.block===bi);
    cases.forEach((cs,ci) => {
      const gid = `b${bi}c${ci}`;
      const a = answered[gid];
      if(a){
        body += `Caso ${ci+1}: ${a.ok?'✅':'❌'} (${t('emailResp')}: ${getCaseOpts(cs)[a.sel].charAt(0)} | ${t('emailCorrect')}: ${getCaseOpts(cs)[a.correct].charAt(0)})%0D%0A`;
        if(a.exp) body += `  ${t('emailExplanation')}: ${a.exp}%0D%0A`;
      }
    });
    body += `%0D%0A`;
  });

  const subject = encodeURIComponent(t('emailSubject',{name:name, ok:ok, total:total}));
  window.location.href = `mailto:${prof}?subject=${subject}&body=${body}`;
}

document.getElementById('stuDate').value = new Date().toISOString().slice(0,10);
const savedLang = localStorage.getItem('testLanguage');
if(savedLang && translations[savedLang]){
  currentLang = savedLang;
  document.querySelectorAll('.lang-selector button').forEach(b=>b.classList.toggle('active', b.dataset.lang===savedLang));
  setLanguage(savedLang);
}

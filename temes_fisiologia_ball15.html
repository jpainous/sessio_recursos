        .slide.active {

            justify-content: center;
            align-items: center;
        }

        ul, ol { margin-left: 30px; margin-bottom: 20px; }
        li { margin: 10px 0; }

            max-width: 100%; max-height: 400px;
            border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .two-columns {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 30px; margin: 20px 0;
        }

        table { width: 100%; border-collapse: collapse; margin: 20px 0; background: white; }
        th, td { padding: 15px; text-align: left; border-bottom: 2px solid #ddd; }
        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; font-weight: bold;
        }
        tr:hover { background-color: #f5f5f5; }

        .navigation {
            position: absolute; bottom: 30px; width: 100%;
            display: flex; justify-content: space-between; padding: 0 50px;
            z-index: 100;
        }

        .nav-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; padding: 15px 30px;
            font-size: 1.2em; border-radius: 50px; cursor: pointer;

        .slide-counter {
            position: absolute; top: 30px; right: 50px;
            background: rgba(255,255,255,0.9); padding: 10px 20px;
            border-radius: 25px; font-weight: bold; color: #667eea; z-index: 100;
        }

        .language-selector {
            position: absolute; top: 30px; left: 50px;

        .language-selector button {
            background: rgba(255,255,255,0.9); border: 2px solid #667eea;

        .language-selector button.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

        let slideIndex = 1;
        const slides = document.getElementsByClassName("slide");
        const totalSlides = slides.length;

        document.getElementById("totalSlides").textContent = totalSlides;

        function setLanguage(lang, btn) {
            currentLang = lang;
            document.querySelectorAll('.language-selector button').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });

            document.documentElement.lang = lang;
        }

        function showSlide(n) {
            if (n > totalSlides) {slideIndex = 1}
            if (n < 1) {slideIndex = totalSlides}

            for (let i = 0; i < slides.length; i++) {
                slides[i].classList.remove("active");
            }

            slides[slideIndex - 1].classList.add("active");
            document.getElementById("currentSlide").textContent = slideIndex;

            document.getElementById("prevBtn").disabled = slideIndex === 1;
            document.getElementById("nextBtn").disabled = slideIndex === totalSlides;
        }

        function changeSlide(n) {
            showSlide(slideIndex += n);
        }

        document.addEventListener('keydown', function(event) {
            if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
                changeSlide(-1);
            } else if (event.key === "ArrowRight" || event.key === "ArrowDown") {
                changeSlide(1);
            }
        });

        let touchStartX = 0;
        let touchEndX = 0;

        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        });

        document.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            if (touchEndX < touchStartX - 50) changeSlide(1);
            if (touchEndX > touchStartX + 50) changeSlide(-1);
        }

        // Inicialització
        setLanguage('ca', document.querySelector('.language-selector button.active'));
        showSlide(slideIndex);
    </script>

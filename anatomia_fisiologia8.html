                m1_why: "It shows that having the parts (bones, organs) is not enough; the active process (metabolism, contraction) is needed for the body to \"sound\" and function.",
                m2_num: "Metaphor 2 of 6", m2_title: "The dance floor and shock absorption",
                m2_anat: "The <strong>floating floor or stage</strong><br><small>(the wooden planks, the springs, the physical structure and materials)</small>",
                m2_fisio: "The <strong>absorption of impact and rebound</strong><br><small>(how the floor responds and gives way when a dancer lands from a grand jeté to protect the knees)</small>",
                m2_why: "It illustrates the difference between anatomical materials (bones, cartilage, menisci) and their biomechanical function (absorbing forces and redistributing load).",
                m3_num: "Metaphor 3 of 6", m3_title: "The score and the performance",
                m3_anat: "The <strong>score</strong><br><small>(the notes written on paper, the silences, the static structure of the work)</small>",
                m3_fisio: "The <strong>performance</strong><br><small>(the tempo, the intensity, the musician's quickened breathing and the emotion that brings those notes to life in real time)</small>",
                m3_why: "Anatomy is like the DNA or the structural map of the body; physiology is the expression of those genes and structures adapting to the present moment.",
                m4_num: "Metaphor 4 of 6", m4_title: "The pointe shoe and dynamic balance",
                m4_anat: "The <strong>pointe shoe</strong><br><small>(the hard box, the satin, the sole, the shape of the foot bones)</small>",
                m4_fisio: "The <strong>dynamic balance and proprioception</strong><br><small>(the constant, invisible micro-adjustment of ankle and core muscles to avoid falling while bearing weight)</small>",
                m4_why: "It highlights that anatomy is the passive support, while physiology is the active neurological control that keeps us standing.",
                m5_num: "Metaphor 5 of 6", m5_title: "The puppet and the tension of the strings",
                m5_anat: "The <strong>puppet</strong><br><small>(the wooden joints, the strings connecting the parts, the weight of the materials)</small>",
                m5_fisio: "The <strong>action of pulling the strings</strong><br><small>(the tension, contraction and coordination that make the puppet walk or dance)</small>",
                m5_why: "It is the perfect metaphor for the nervous and muscular system: the bones are the wood, the tendons are the strings, and physiology is the brain's command (nerve impulse) that generates movement.",

                m6_why: "It helps understand concepts such as thermodynamics or homeostasis: anatomy is the tissue (skin, sweat glands), physiology is how that tissue reacts to heat and movement to cool the body.",

        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const totalSlides = slides.length;

        function setLanguage(lang, btn) {
            currentLang = lang;
            document.querySelectorAll('.language-selector button').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    el.innerHTML = translations[lang][key];
                }
            });

            document.documentElement.lang = lang;
        }

        function showSlide(n) {
            slides.forEach(slide => slide.classList.remove('active'));
            slides[n].classList.add('active');

            document.getElementById('slideCounter').textContent = `${n + 1} / ${totalSlides}`;
            document.getElementById('progressFill').style.width = `${((n + 1) / totalSlides) * 100}%`;

            document.getElementById('prevBtn').disabled = n === 0;
            document.getElementById('nextBtn').disabled = n === totalSlides - 1;
        }

        function changeSlide(direction) {
            currentSlide += direction;
            if (currentSlide < 0) currentSlide = 0;
            if (currentSlide >= totalSlides) currentSlide = totalSlides - 1;
            showSlide(currentSlide);
        }

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.key === 'ArrowLeft') changeSlide(-1);
            if (e.key === 'ArrowRight') changeSlide(1);
        });

        // Inicialitzar
        setLanguage('ca', document.querySelector('.language-selector button.active'));
        showSlide(currentSlide);
    </script>

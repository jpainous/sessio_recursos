<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guia d'ús · Activitats de fisiologia</title>
<style>
  :root{
    --primary:#0f4c5c;
    --secondary:#1b7f8c;
    --accent:#e36414;
    --bg:#f4f7f8;
    --card:#ffffff;
    --text:#1f2933;
    --muted:#5c6b73;
    --ok:#2a9d8f;
    --err:#c1121f;
    --essay:#6a4c93;
    --gold:#c9a227;
  }
  *{box-sizing:border-box;}
  body{
    font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    margin:0;
    padding:20px;
    line-height:1.6;
  }
  .wrap{max-width:900px;margin:0 auto;}
  header{
    background:linear-gradient(135deg,var(--primary),var(--secondary));
    color:#fff;
    padding:30px 24px;
    border-radius:14px;
    margin-bottom:22px;
    box-shadow:0 6px 18px rgba(15,76,92,.25);
  }
  header h1{margin:0 0 8px;font-size:1.75rem;}
  header p{margin:0;opacity:.95;font-size:1rem;}

  .lang-switch{
    display:flex;
    gap:10px;
    margin-bottom:22px;
    flex-wrap:wrap;
  }
  .lang-switch button{
    background:#fff;
    border:2px solid var(--secondary);
    color:var(--secondary);
    padding:8px 18px;
    border-radius:30px;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
    font-size:.9rem;
  }
  .lang-switch button.active,
  .lang-switch button:hover{
    background:var(--secondary);
    color:#fff;
  }

  .index{
    background:#fff;
    border-radius:12px;
    padding:18px 22px;
    margin-bottom:22px;
    box-shadow:0 3px 10px rgba(0,0,0,.07);
    border-left:5px solid var(--gold);
  }
  .index h2{
    margin:0 0 10px;
    color:var(--primary);
    font-size:1.1rem;
  }
  .index ol{
    margin:0;
    padding-left:1.4rem;
  }
  .index li{
    margin-bottom:5px;
    font-size:.98rem;
  }
  .index a{
    color:var(--primary);
    text-decoration:none;
    border-bottom:1px solid #c9a227;
  }
  .index a:hover{color:var(--accent);}

  section.card{
    background:#fff;
    border-radius:12px;
    padding:22px 24px;
    margin-bottom:20px;
    box-shadow:0 3px 10px rgba(0,0,0,.07);
    border-left:5px solid var(--secondary);
  }
  section.card.important{border-left-color:var(--accent);}
  section.card.session{border-left-color:var(--gold);}
  section.card.print{border-left-color:var(--essay);}
  section.card.export{border-left-color:var(--primary);}

  section.card h2{
    margin:0 0 12px;
    color:var(--primary);
    font-size:1.25rem;
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  section.card h3{
    margin:16px 0 6px;
    color:var(--secondary);
    font-size:1.02rem;
  }
  section.card p{margin:0 0 10px;}
  section.card ul, section.card ol{
    margin:0 0 10px;
    padding-left:1.4rem;
  }
  section.card li{margin-bottom:5px;}

  .badge{
    font-size:.7rem;
    background:var(--accent);
    color:#fff;
    padding:3px 10px;
    border-radius:20px;
    font-weight:700;
    letter-spacing:.4px;
    text-transform:uppercase;
    white-space:nowrap;
  }
  .badge.gold{background:var(--gold);}
  .badge.essay{background:var(--essay);}
  .badge.primary{background:var(--primary);}

  .callout{
    background:#f4f0fa;
    border-left:4px solid var(--essay);
    padding:12px 16px;
    border-radius:8px;
    margin:12px 0;
    font-size:.95rem;
    color:#3d2c5c;
  }
  .callout.warn{
    background:#fff3cd;
    border-left-color:#ffe08a;
    color:#7a5b00;
  }
  .callout.info{
    background:#e3f0fb;
    border-left-color:#1565c0;
    color:#0b3a6a;
  }
  .callout b{color:inherit;}
  .callout code{
    background:#fff;
    padding:1px 6px;
    border-radius:4px;
    font-size:.85rem;
  }

  .steps{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:12px;
    margin:14px 0 6px;
  }
  .step{
    background:#f4f9fa;
    border-radius:10px;
    padding:12px 14px;
    border:1px solid #e0ecee;
  }
  .step .num{
    display:inline-block;
    background:var(--secondary);
    color:#fff;
    width:24px;
    height:24px;
    border-radius:50%;
    text-align:center;
    line-height:24px;
    font-weight:700;
    font-size:.85rem;
    margin-right:6px;
  }
  .step h4{
    margin:0 0 6px;
    font-size:.92rem;
    color:var(--primary);
    text-transform:uppercase;
    letter-spacing:.5px;
  }
  .step p{margin:0;font-size:.88rem;color:var(--muted);}

  footer{
    text-align:center;
    color:var(--muted);
    font-size:.85rem;
    margin-top:30px;
    padding:18px;
  }

  .hidden{display:none;}

  @media(max-width:600px){
    header h1{font-size:1.35rem;}
    section.card{padding:18px;}
  }
</style>
</head>

/* ============================================================
   RENDER
   ============================================================ */
let currentLang = "ca";

function setLang(lang){
  currentLang = lang;
  document.querySelectorAll(".lang-switch button").forEach(b=>b.classList.remove("active"));
  document.querySelector(`.lang-switch button[onclick="setLang('${lang}')"]`).classList.add("active");
  render();
}

function render(){
  const t = G[currentLang];
  document.getElementById("titol").textContent = t.titol;
  document.getElementById("subtitol").textContent = t.subtitol;
  document.getElementById("footer").textContent = t.footer;

  // Índex
  const index = document.getElementById("index");
  let htmlIndex = `<h2>${t.indexTitol}</h2><ol>`;
  t.seccions.forEach(s => {
    htmlIndex += `<li><a href="#${s.id}">${s.titol}</a></li>`;
  });
  htmlIndex += `</ol>`;
  index.innerHTML = htmlIndex;

  // Contingut
  const main = document.getElementById("contingut");
  main.innerHTML = "";

  // intro
  main.appendChild(renderSeccio(t.intro, "intro", ""));

  // guardar
  main.appendChild(renderSeccio(t.guardar, "guardar", "session", "llista", t.guardar.nota, t.guardar.nota2));

  // recuperar
  main.appendChild(renderSeccio(t.recuperar, "recuperar", "session", null, t.recuperar.nota));

  // esborrar
  main.appendChild(renderSeccio(t.esborrar, "esborrar", "session", null, t.esborrar.nota));

  // repassar
  main.appendChild(renderSeccio(t.repassar, "repassar", "", null, t.repassar.nota));

  // adaptat
  main.appendChild(renderSeccio(t.adaptat, "adaptat", "", null, t.adaptat.nota));

  // imprimir
  main.appendChild(renderSeccio(t.imprimir, "imprimir", "print", "llista", t.imprimir.nota, t.imprimir.nota2));

  // exportar
  main.appendChild(renderSeccio(t.exportar, "exportar", "export", null, t.exportar.nota));

  // lliurament (amb passos)
  main.appendChild(renderLliurament(t.lliurament));

  // idiomes
  main.appendChild(renderSeccio(t.idiomes, "idiomes", "", null, t.idiomes.nota));

  // consells (amb problemes)
  main.appendChild(renderConsells(t.consells));
}

function renderSeccio(d, id, classeExtra, tipusLlista, nota1, nota2){
  const sec = document.createElement("section");
  sec.className = "card " + (classeExtra || "");
  sec.id = id;
  let html = `<h2>${d.titol}</h2>`;
  (d.paragrafs || []).forEach(p => {
    html += `<p>${p}</p>`;
  });
  if(tipusLlista === "llista" && d.llista){
    html += `<ul>${d.llista.map(x=>`<li>${x}</li>`).join("")}</ul>`;
  }
  if(nota1) html += `<div class="callout warn">${nota1}</div>`;
  if(nota2) html += `<div class="callout info">${nota2}</div>`;
  sec.innerHTML = html;
  return sec;
}

function renderLliurament(d){
  const sec = document.createElement("section");
  sec.className = "card important";
  sec.id = "lliurament";
  let html = `<h2>${d.titol}</h2>`;
  (d.paragrafs || []).forEach(p => { html += `<p>${p}</p>`; });
  html += `<div class="steps">`;
  d.passos.forEach((pas, i) => {
    html += `<div class="step">
      <h4><span class="num">${i+1}</span>${pas.t}</h4>
      <p>${pas.d}</p>
    </div>`;
  });
  html += `</div>`;
  if(d.nota) html += `<div class="callout info" style="margin-top:14px;">${d.nota}</div>`;
  sec.innerHTML = html;
  return sec;
}

function renderConsells(d){
  const sec = document.createElement("section");
  sec.className = "card";
  sec.id = "consells";
  let html = `<h2>${d.titol}</h2>`;
  d.problemes.forEach(p => {
    html += `<h3>❓ ${p.t}</h3><p>${p.d}</p>`;
  });
  sec.innerHTML = html;
  return sec;
}

/* ============================================================
   INICI
   ============================================================ */
render();

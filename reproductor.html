<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <title>Reproductor de vídeo</title>
  <style>
    body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
    video { max-width: 100%; max-height: 100%; }
  </style>
</head>
<body>
  <video id="reproductor" controls autoplay>
    El teu navegador no suporta l'etiqueta de vídeo.
  </video>

  <script>
    // Llegeix el paràmetre ?v= de la URL
    const params = new URLSearchParams(window.location.search);
    const video = params.get('v');

    if (video) {
      document.getElementById('reproductor').src = video;
    } else {
      document.body.innerHTML = '<p style="color:white">No s\'ha especificat cap vídeo.</p>';
    }
  </script>
</body>
</html>

<!DOCTYPE html>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        /* Estil per al selector d'idioma */
        .lang-switch {
            display: flex; gap: 10px; margin-bottom: 20px; width: 100%; max-width: 1050px;
        }
        .lang-switch button {
            background: #fff; border: 2px solid #e94560; color: #e94560;
            padding: 8px 18px; border-radius: 30px; font-weight: 600; cursor: pointer;
            transition: .2s; font-size: .9rem; font-family: inherit;
        }
        .lang-switch button.active, .lang-switch button:hover {
            background: #e94560; color: #fff;
        }

        .slide {
            width: 100%;
            max-width: 1050px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            margin-bottom: 40px;
            overflow: hidden;
        }
        .slide-header {
            background: linear-gradient(135deg, #16213e, #0f3460);
            color: white;
            padding: 18px 28px;
        }
        .slide-header h2 { font-size: 1.4rem; font-weight: 600; }
        .slide-header .subtitle { font-size: 0.85rem; opacity: 0.8; margin-top: 3px; }
        .slide-header .badge {
            display: inline-block;
            background: #e94560;
            color: white;
            font-size: 0.7rem;
            padding: 2px 10px;
            border-radius: 12px;
            margin-left: 10px;
            vertical-align: middle;
        }
        .slide-body { padding: 22px 28px; }
        .section-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #0f3460;
            border-left: 5px solid #e94560;
            padding-left: 12px;
            margin-bottom: 10px;
            margin-top: 18px;
        }
        .section-title:first-of-type { margin-top: 0; }
        ul { list-style: none; padding-left: 0; }
        ul li {
            padding: 5px 0 5px 20px;
            position: relative;
            font-size: 0.92rem;
            line-height: 1.55;
            color: #2d3436;
        }
        ul li::before { content: "▸"; color: #e94560; font-weight: bold; position: absolute; left: 0; }
        .exercise-box {
            background: #fff8e6;
            border: 2px solid #f0b400;
            border-radius: 12px;
            padding: 16px 20px;
            margin-top: 20px;
        }
        .exercise-box strong {
            color: #b8860b;
            display: block;
            margin-bottom: 8px;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .exercise-box p, .exercise-box ol {
            font-size: 0.9rem;
            color: #444;
            line-height: 1.6;
        }
        .exercise-box ol { padding-left: 20px; margin-top: 6px; }
        .exercise-box ol li { padding: 3px 0; font-size: 0.9rem; }
        .exercise-box ol li::before { content: none; }
        .source { font-size: 0.75rem; color: #888; margin-top: 15px; border-top: 1px solid #eee; padding-top: 8px; font-style: italic; }
        .image-placeholder {
            background: #e8eef5;
            border: 2px dashed #b0c4de;
            border-radius: 12px;
            padding: 18px 15px;
            text-align: center;
            color: #4a6a8a;
            font-size: 0.85rem;
            min-height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 15px 0;
        }
        .image-placeholder .icon { font-size: 1.8rem; margin-bottom: 6px; }
        .two-col { display: flex; gap: 25px; flex-wrap: wrap; }
        .two-col > div { flex: 1; min-width: 280px; }
    </style>
</head>

function setLang(lang) {
    // Actualitzar botons
    document.querySelectorAll('.lang-switch button').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-' + lang).classList.add('active');

    const t = translations[lang];

    // Actualitzar elements generals
    document.querySelectorAll('.l-badge').forEach(el => el.textContent = t.badge);
    document.querySelectorAll('.l-source-title').forEach(el => el.textContent = t.source);

    // Funció auxiliar per omplir una diapositiva
    function fillSlide(id, data) {
        document.querySelector(`.l-${id}-title`).textContent = data.title;
        document.querySelector(`.l-${id}-sub`).textContent = data.sub;
        document.querySelector(`.l-${id}-s1-title`).textContent = data.s1_title;
        document.querySelector(`.l-${id}-s1-list`).innerHTML = data.s1_list.map(item => `<li>${item}</li>`).join('');
        document.querySelector(`.l-${id}-s2-title`).textContent = data.s2_title;
        document.querySelector(`.l-${id}-s2-list`).innerHTML = data.s2_list.map(item => `<li>${item}</li>`).join('');
        
        if (data.img) {
            const imgEl = document.querySelector(`.l-${id}-img`);
            if(imgEl) imgEl.textContent = data.img;
        }

        document.querySelector(`.l-${id}-ex-title`).textContent = data.ex_title;
        document.querySelector(`.l-${id}-ex-content`).innerHTML = data.ex_content;
        document.querySelector(`.l-${id}-source`).innerHTML = data.source;
    }

    // Omplir totes les diapositives
    fillSlide('1-1', t.s1_1);
    fillSlide('2-1', t.s2_1);
    fillSlide('2-2', t.s2_2);
    fillSlide('3-1', t.s3_1);
    fillSlide('4-1', t.s4_1);
    fillSlide('5-1', t.s5_1);
    fillSlide('6-1', t.s6_1);
    fillSlide('7-1', t.s7_1);
    fillSlide('8-1', t.s8_1);
    fillSlide('9-1', t.s9_1);
    fillSlide('10-1', t.s10_1);
}

// Inicialitzar en Català en carregar
window.onload = () => setLang('ca');
